<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TS Dollar - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0a0a; color: #fff; }
    .admin-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
    .form-control { background: #1a1a1a; border: 1px solid #333; color: #fff; }
    .form-control:focus { background: #1a1a1a; border-color: #00ff88; color: #fff; box-shadow: 0 0 0 0.25rem rgba(0,255,136,.25); }
    .btn-save { background: linear-gradient(90deg, #00ff88, #00ccff); border: none; color: #000; font-weight: 700; }
    .btn-save:hover { opacity: 0.9; }
    table { color: #fff; }
    .badge { font-size: 0.9rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock"></i> TS Dollar Admin</span>
  </div>
</nav>

<div class="container mt-4">

  <!-- 1. RATE UPDATE SECTION -->
  <div class="admin-card">
    <h4 class="mb-3"><i class="bi bi-graph-up-arrow text-success"></i> Update Exchange Rates</h4>
    <div class="row g-3">
      
      <div class="col-md-6">
        <h6>Payoneer</h6>
        <div class="input-group mb-2">
          <span class="input-group-text">Buy</span>
          <input type="number" id="payoneerBuy" class="form-control" placeholder="125">
          <span class="input-group-text">BDT</span>
        </div>
        <div class="input-group mb-2">
          <span class="input-group-text">Sell</span>
          <input type="number" id="payoneerSell" class="form-control" placeholder="128">
          <span class="input-group-text">BDT</span>
        </div>
      </div>

      <div class="col-md-6">
        <h6>Wise</h6>
        <div class="input-group mb-2">
          <span class="input-group-text">Buy</span>
          <input type="number" id="wiseBuy" class="form-control" placeholder="124">
          <span class="input-group-text">BDT</span>
        </div>
        <div class="input-group mb-2">
          <span class="input-group-text">Sell</span>
          <input type="number" id="wiseSell" class="form-control" placeholder="127">
          <span class="input-group-text">BDT</span>
        </div>
      </div>

      <div class="col-md-6">
        <h6>USDT</h6>
        <div class="input-group mb-2">
          <span class="input-group-text">Buy</span>
          <input type="number" id="usdtBuy" class="form-control" placeholder="122">
          <span class="input-group-text">BDT</span>
        </div>
        <div class="input-group mb-2">
          <span class="input-group-text">Sell</span>
          <input type="number" id="usdtSell" class="form-control" placeholder="125">
          <span class="input-group-text">BDT</span>
        </div>
      </div>

      <div class="col-md-6">
        <h6>Skrill</h6>
        <div class="input-group mb-2">
          <span class="input-group-text">Buy</span>
          <input type="number" id="skrillBuy" class="form-control" placeholder="123">
          <span class="input-group-text">BDT</span>
        </div>
        <div class="input-group mb-2">
          <span class="input-group-text">Sell</span>
          <input type="number" id="skrillSell" class="form-control" placeholder="126">
          <span class="input-group-text">BDT</span>
        </div>
      </div>

    </div>
    <button id="saveRates" class="btn btn-save btn-lg w-100 mt-3"><i class="bi bi-check-circle"></i> Save All Rates</button>
  </div>

  <!-- 2. ORDER LIST SECTION -->
  <div class="admin-card">
    <h4 class="mb-3"><i class="bi bi-list-check text-info"></i> Recent Orders</h4>
    <div class="table-responsive">
      <table class="table table-dark table-hover">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Name</th>
            <th>Wallet</th>
            <th>USD Amount</th>
            <th>BDT Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ordersTable">
          <tr><td colspan="6" class="text-center">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="admin.js"></script>

</body>
</html>
