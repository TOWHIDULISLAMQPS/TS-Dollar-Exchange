<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - TS Dollar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#071826;color:white;}</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<div class="container mt-4">
<h2 class="mb-4">TS Dollar - Admin Panel <button onclick="logout()" class="btn btn-danger float-end">Logout</button></h2>

<!-- Rate Control -->
<div class="card bg-dark p-3 mb-4">
<h4>Rate Control</h4>
<div class="row g-2">
<div class="col-md-4"><input id="buyRate" type="number" placeholder="Buy Rate BDT" class="form-control"></div>
<div class="col-md-4"><input id="sellRate" type="number" placeholder="Sell Rate BDT" class="form-control"></div>
<div class="col-md-4"><button onclick="updateRate()" class="btn btn-success w-100">Update Rate</button></div>
</div>
</div>

<!-- Orders -->
<div class="card bg-dark p-3">
<h4>New Orders</h4>
<table class="table table-dark table-striped">
<thead><tr><th>Email</th><th>Amount $</th><th>Type</th><th>Time</th></tr></thead>
<tbody id="orderTable"></tbody>
</table>
</div>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",authDomain:"ts-dollar-exchange.firebaseapp.com",databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app"});
const auth = firebase.auth();
const db = firebase.database();

// 1. Login Check - Login না থাকলে ফেরত পাঠাবে
auth.onAuthStateChanged((user) => {
if (!user) {
window.location.href = "login.html";
}
});

// 2. Rate Load
db.ref('rates').on('value',(snap)=>{
let data=snap.val() || {buy:120,sell:122};
document.getElementById('buyRate').value=data.buy;
document.getElementById('sellRate').value=data.sell;
});

// 3. Rate Update
function updateRate(){
let buy=document.getElementById('buyRate').value;
let sell=document.getElementById('sellRate').value;
db.ref('rates').set({buy:buy,sell:sell});
alert("✅ Rate Updated! Home + Exchange এ Auto Update হবে");
}

// 4. Order Load
db.ref('orders').on('child_added',(snap)=>{
let o=snap.val();
document.getElementById('orderTable').innerHTML=`<tr><td>${o.email}</td><td>${o.amount}</td><td>${o.type}</td><td>${o.time}</td></tr>` + document.getElementById('orderTable').innerHTML;
});

// 5. Logout
function logout(){
auth.signOut().then(()=>{window.location.href="login.html";});
}
</script>
</body>
</html>
