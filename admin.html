<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f0f2f5; font-family: 'Poppins', sans-serif; }
.login-card { max-width: 400px; margin: 100px auto; }
.dashboard-card { background:#fff; padding:30px; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-card">
<div class="card shadow">
<div class="card-body p-4">
<h3 class="text-center mb-4 text-primary">Admin Login</h3>
<form id="loginForm">
<input type="email" id="email" class="form-control mb-3" placeholder="Admin Email" value="towhidulislamtuhin872@gmail.com" required>
<input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
<p id="loginError" class="text-danger text-center small"></p>
<button id="loginBtn" type="submit" class="btn btn-primary w-100">Login</button>
</form>
</div>
</div>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashboardPage" class="container py-5" style="display:none;">
<div class="d-flex justify-content-between align-items-center mb-4">
<h2>Exchange Rate Dashboard</h2>
<button id="logoutBtn" class="btn btn-danger">Logout</button>
</div>

<div class="dashboard-card">
<h4 class="mb-4">Update Live Rates</h4>
<form id="rateForm">
<div class="row g-3">
<div class="col-md-6"><label>Payoneer Buy</label><input type="number" id="payoneerBuy" class="form-control" step="0.01"></div>
<div class="col-md-6"><label>Payoneer Sell</label><input type="number" id="payoneerSell" class="form-control" step="0.01"></div>
<div class="col-md-6"><label>Wise Buy</label><input type="number" id="wiseBuy" class="form-control" step="0.01"></div>
<div class="col-md-6"><label>Wise Sell</label><input type="number" id="wiseSell" class="form-control" step="0.01"></div>
<div class="col-md-6"><label>USDT Buy</label><input type="number" id="usdtBuy" class="form-control" step="0.01"></div>
<div class="col-md-6"><label>USDT Sell</label><input type="number" id="usdtSell" class="form-control" step="0.01"></div>
<div class="col-md-6"><label>Skrill Buy</label><input type="number" id="skrillBuy" class="form-control" step="0.01"></div>
<div class="col-md-6"><label>Skrill Sell</label><input type="number" id="skrillSell" class="form-control" step="0.01"></div>
</div>
<button id="updateBtn" type="submit" class="btn btn-success w-100 mt-4">Update Rates</button>
</form>
</div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
