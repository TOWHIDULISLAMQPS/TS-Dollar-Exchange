<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Dollar Exchange - #1 Trusted Exchange in BD</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root { --primary: #8b5cf6; --success: #10b981; --dark1: #0a0a2a; --dark2: #1a1a3a; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, var(--dark1) 0%, var(--dark2) 50%, #3a0a5a 100%);
  min-height: 100vh; background-attachment: fixed; padding-bottom: 80px;
}
.navbar { background: rgba(10,10,42,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
.navbar-brand { letter-spacing: -0.5px; font-weight: 900; color: #fff!important; }

.main-card {
  border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
}

.wallet-card {
  cursor: pointer; border: 2px solid #e5e7eb; transition: all 0.3s;
  border-radius: 14px; padding: 12px 8px; text-align: center; background: #fff; font-weight: 700;
}
.wallet-card:hover { border-color: var(--primary); transform: translateY(-3px); }
.wallet-card.selected {
  border-color: var(--success);
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
}
.wallet-icon {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 6px; font-weight: 900; font-size: 16px; color: #fff;
}

.swap-btn {
  width: 50px; height: 50px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--primary), #6366f1);
  color: #fff; font-size: 20px; box-shadow: 0 8px 20px rgba(139,92,246,0.4);
  transition: 0.4s; margin: -25px auto; position: relative; z-index: 2;
}
.swap-btn:hover { transform: rotate(180deg) scale(1.1); }

.input-box {
  background: #f8fafc; border-radius: 14px; padding: 16px;
  border: 2px solid #e2e8f0; transition: 0.3s;
}
.input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }

.section-card {
  background: rgba(255,255,255,0.95); border-radius: 20px; padding: 24px;
  border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}
.rate-item {
  background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px;
  border-left: 4px solid var(--success); box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.btn-exchange{
  background: linear-gradient(135deg, var(--success), #059669);
  border-radius: 14px; padding: 16px; font-weight: 800;
  box-shadow: 0 10px 25px rgba(16,185,129,0.3);
  transition: 0.3s;
}
.btn-exchange:hover{ transform: translateY(-2px); box-shadow: 0 15px 35px rgba(16,185,129,0.4); }

.whatsapp-float {
  position: fixed; bottom: 20px; right: 20px;
  background: linear-gradient(135deg, #25D366, #128C7E); color: #fff;
  border-radius: 50px; padding: 12px 20px; font-weight: 700; text-decoration: none;
  box-shadow: 0 10px 30px rgba(37,211,102,0.4); z-index: 999;
  display: flex; align-items: center; gap: 8px;
}
.trust-badge { background: #f0fdf4; color: #166534; padding: 6px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fs-4" href="#"><i class="bi bi-shield-shaded text-warning"></i> TS Dollar Exchange</a>
    <a href="customer.html" class="btn btn-outline-light btn-sm"><i class="bi bi-person"></i> Login</a>
  </div>
</nav>

<div class="container my-4">
  <div class="main-card p-4">
    <h4 class="text-center mb-1 fw-bold"><i class="bi bi-lightning text-warning"></i> Instant & Secure Exchange</h4>
    <p class="text-center text-muted mb-4" style="font-size:13px;">Trusted by 10,000+ Users in Bangladesh</p>

    <!-- YOU SEND -->
    <div class="mb-3">
      <label class="fw-bold mb-2">You Send</label>
      <div class="input-box d-flex align-items-center mb-3">
        <input type="number" id="sendAmount" class="form-control border-0 bg-transparent fs-3 fw-bold" placeholder="0.00">
        <span id="sendCurrency" class="fw-bold fs-5 ms-2">USD</span>
      </div>
      <div class="row g-2" id="sendWallets"></div>
    </div>

    <!-- SWAP BUTTON -->
    <div class="text-center my-2">
      <button class="swap-btn" onclick="swapWallets()"><i class="bi bi-arrow-down-up"></i></button>
    </div>

    <!-- YOU GET -->
    <div class="mb-4">
      <label class="fw-bold mb-2">You Get</label>
      <div class="input-box d-flex align-items-center mb-3">
        <input type="text" id="getAmount" class="form-control border-0 bg-transparent fs-3 fw-bold" placeholder="0.00" readonly>
        <span id="getCurrency" class="fw-bold fs-5 ms-2">BDT</span>
      </div>
      <div class="row g-2" id="getWallets"></div>
    </div>

    <button class="btn btn-exchange w-100 text-white" onclick="checkLoginAndExchange()">
      Exchange Now <i class="bi bi-arrow-right-circle"></i>
    </button>

    <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
      <span class="trust-badge"><i class="bi bi-shield-check"></i> 100% Secure</span>
      <span class="trust-badge"><i class="bi bi-lightning"></i> Instant</span>
      <span class="trust-badge"><i class="bi bi-headset"></i> 24/7</span>
    </div>
  </div>

  <!-- LIVE RATE TABLE -->
  <div class="section-card mt-4">
    <h6 class="mb-3 text-center fw-bold"><i class="bi bi-graph-up-arrow text-primary"></i> USD Wallet Rates <span id="rateLoading" class="spinner-border spinner-border-sm"></span></h6>
    <div id="rateList"><p class="text-center text-muted">Loading Rates...</p></div>
    <small class="text-muted">* Rates updated live from Admin Panel</small>
  </div>
</div>

<!-- STICKY WHATSAPP BUTTON -->
<a href="https://wa.me/8801726858565" target="_blank" class="whatsapp-float"><i class="bi bi-whatsapp fs-5"></i> Chat Now</a>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt: { name: "USDT", type: "USD", icon: "₮", color: "#26A17B" },
  payoneer: { name: "Payoneer", type: "USD", icon: "P", color: "#FF4800" },
  wise: { name: "Wise", type: "USD", icon: "W", color: "#00B9FF" },
  skrill: { name: "Skrill", type: "USD", icon: "S", color: "#8A2BE2" },
  bkash: { name: "Bkash", type: "BDT", icon: "bK", color: "#E2136E" },
  nagad: { name: "Nagad", type: "BDT", icon: "N", color: "#F26522" },
  rocket: { name: "Rocket", type: "BDT", icon: "R", color: "#8B0000" },
  upay: { name: "Upay", type: "BDT", icon: "U", color: "#FF6B00" }
};

let rates = {};
let selectedSend = 'payoneer';
let selectedGet = 'bkash';

db.ref('rates/wallets').on('value',(snap)=>{
  rates = snap.val() || {};
  document.getElementById('rateLoading').style.display='none';
  renderWallets();
  renderRates();
  calculate();
});

function renderWallets(){
  let sendHtml = '', getHtml = '';
  for(let key in wallets){
    sendHtml += `<div class="col-3"><div class="wallet-card ${selectedSend==key?'selected':''}" onclick="selectSend('${key}')"><div class="wallet-icon" style="background:${wallets[key].color}">${wallets[key].icon}</div><small>${wallets[key].name}</small></div></div>`;
    getHtml += `<div class="col-3"><div class="wallet-card ${selectedGet==key?'selected':''}" onclick="selectGet('${key}')"><div class="wallet-icon" style="background:${wallets[key].color}">${wallets[key].icon}</div><small>${wallets[key].name}</small></div></div>`;
  }
  sendWallets.innerHTML = sendHtml;
  getWallets.innerHTML = getHtml;
}

function renderRates(){
  let html = '';
  const usdWallets = ['usdt','payoneer','wise','skrill'];
  usdWallets.forEach(key => {
    if(rates[key]){
      html += `<div class="rate-item d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2"><div class="wallet-icon" style="background:${wallets[key].color}; width:32px; height:32px; font-size:14px">${wallets[key].icon}</div><span class="fw-bold">${wallets[key].name}</span></div>
        <div><span class="text-success fw-bold">Buy: ${rates[key].buy} ৳</span><span class="mx-2">|</span><span class="text-danger fw-bold">Sell: ${rates[key].sell} ৳</span></div>
      </div>`;
    }
  });
  rateList.innerHTML = html;
}

function selectSend(key){ selectedSend = key; sendCurrency.innerText = wallets[key].type; renderWallets(); calculate(); }
function selectGet(key){ selectedGet = key; getCurrency.innerText = wallets[key].type; renderWallets(); calculate(); }
function swapWallets(){ let temp = selectedSend; selectedSend = selectedGet; selectedGet = temp; renderWallets(); calculate(); }

function calculate(){
  let amount = parseFloat(sendAmount.value) || 0;
  if(!rates[selectedSend] ||!rates[selectedGet]) return;
  let result = 0;
  if(wallets[selectedSend].type == 'USD' && wallets[selectedGet].type == 'BDT'){ result = amount * rates[selectedSend].sell; }
  if(wallets[selectedSend].type == 'BDT' && wallets[selectedGet].type == 'USD'){ result = amount / rates[selectedGet].buy; }
  getAmount.value = result.toFixed(2);
}
sendAmount.addEventListener('input', calculate);

function goToOrder(){
  if(sendAmount.value <= 0){ alert('Amount দিন'); return; }
  localStorage.setItem('exchangeData', JSON.stringify({
    send: { wallet: selectedSend, amount: sendAmount.value },
    get: { wallet: selectedGet, amount: getAmount.value }
  }));
  window.location.href = 'order.html';
}

function checkLoginAndExchange(){
    auth.onAuthStateChanged(function(user) {
        if (user) { goToOrder(); }
        else {
          alert('Please login first to continue');
          window.location.href = 'customer.html';
        }
    });
}
</script>
</body>
</html>
