<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { background: #f8f9fa; font-family: 'Poppins', sans-serif; }
.exchange-card { background:#fff; padding:40px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.1); margin-top:50px; }
.navbar-brand { font-weight: 700; color: #0d6efd!important; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fs-3" href="index.html"><i class="fa fa-shield-halved text-warning"></i> TS Dollar Exchange</a>
</div>
</nav>

<div class="container">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="exchange-card">
<h3 class="text-center mb-4">Exchange Now</h3>

<div class="mb-3">
<label class="form-label">You Send</label>
<select id="sendWallet" class="form-select">
  <option value="paypal">Paypal</option>
  <option value="wise">Wise</option>
  <option value="payoneer">Payoneer</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Amount USD</label>
<input id="sendAmount" type="number" class="form-control" placeholder="100" value="100">
</div>

<div class="mb-3">
<label class="form-label">You Will Receive</label>
<select id="getWallet" class="form-select">
  <option value="bkash">Bkash</option>
  <option value="nagad">Nagad</option>
  <option value="upay">Upay</option>
  <option value="bank">Bank</option>
</select>
<input id="getAmount" type="text" class="form-control mt-2" readonly>
</div>

<button id="exchangeBtn" class="btn btn-primary w-100 btn-lg fw-bold">Exchange Now</button>

</div>
</div>
</div>
</div>

<script>
// Rate calculation er jonno example: 1 USD = 120 BDT
document.getElementById('sendAmount').addEventListener('input', calculate);
document.getElementById('getWallet').addEventListener('change', calculate);

function calculate(){
  const amount = document.getElementById('sendAmount').value;
  const rate = 120; // Tomar rate
  document.getElementById('getAmount').value = amount * rate + ' BDT';
}
calculate();

// ========= IMPORTANT: DATA SAVE + REDIRECT CODE =========
document.getElementById('exchangeBtn').addEventListener('click', function() {
  const sendWallet = document.getElementById('sendWallet').value;
  const sendAmount = document.getElementById('sendAmount').value;
  const getWallet = document.getElementById('getWallet').value;
  const getAmount = document.getElementById('getAmount').value;

  const exchangeData = {
    send: { wallet: sendWallet, amount: sendAmount },
    get: { wallet: getWallet, amount: getAmount }
  };

  localStorage.setItem('exchangeData', JSON.stringify(exchangeData)); // 1. Data save
  window.location.href = 'order.html'; // 2. Order page e pathao
});
// ========= CODE END =========
</script>
</body>
</html>
