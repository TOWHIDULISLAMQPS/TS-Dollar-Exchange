<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
.navbar { background: linear-gradient(135deg, #0d6efd, #00a859); }
.card { border-radius: 16px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
.wallet-card { cursor: pointer; border: 2px solid #eee; transition: 0.2s; border-radius: 12px; padding: 15px; text-align: center; }
.wallet-card:hover { border-color: #0d6efd; }
.wallet-card.selected { border-color: #00a859; background: #e8f5e9; }
.swap-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #0d6efd; color: #fff; font-size: 20px; }
.input-box { background: #f1f3f5; border-radius: 10px; padding: 15px; }
</style>
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3" href="#">TS Dollar Exchange</a>
  </div>
</nav>

<div class="container my-5">
  <div class="card p-4 p-md-5">
    <h3 class="text-center fw-bold mb-4">Instant Exchange</h3>

    <!-- YOU SEND -->
    <div class="mb-4">
      <label class="fw-semibold mb-2">You Send</label>
      <div class="input-box d-flex align-items-center mb-3">
        <input type="number" id="sendAmount" class="form-control border-0 bg-transparent fs-4" placeholder="0.00">
        <span id="sendCurrency" class="fw-bold fs-5 ms-2">USD</span>
      </div>
      <div class="row g-2" id="sendWallets"></div>
    </div>

    <!-- SWAP BUTTON -->
    <div class="text-center my-3">
      <button class="swap-btn" onclick="swapWallets()">⇅</button>
    </div>

    <!-- YOU GET -->
    <div class="mb-4">
      <label class="fw-semibold mb-2">You Get</label>
      <div class="input-box d-flex align-items-center mb-3">
        <input type="text" id="getAmount" class="form-control border-0 bg-transparent fs-4" placeholder="0.00" readonly>
        <span id="getCurrency" class="fw-bold fs-5 ms-2">BDT</span>
      </div>
      <div class="row g-2" id="getWallets"></div>
    </div>

    <button class="btn btn-success btn-lg w-100 fw-bold" onclick="goToOrder()">Exchange Now</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const wallets = {
  usdt: { name: "USDT", type: "USD", icon: "₮" },
  payoneer: { name: "Payoneer", type: "USD", icon: "P" },
  wise: { name: "Wise", type: "USD", icon: "W" },
  skrill: { name: "Skrill", type: "USD", icon: "S" },
  bkash: { name: "Bkash", type: "BDT", icon: "bK" },
  nagad: { name: "Nagad", type: "BDT", icon: "N" },
  rocket: { name: "Rocket", type: "BDT", icon: "R" },
  upay: { name: "Upay", type: "BDT", icon: "U" }
};

let rates = {};
let selectedSend = 'payoneer';
let selectedGet = 'bkash';

db.ref('rates/wallets').on('value',(snap)=>{
  rates = snap.val() || {};
  renderWallets();
  calculate();
});

function renderWallets(){
  let sendHtml = '', getHtml = '';
  for(let key in wallets){
    sendHtml += `<div class="col-3 col-md-1-5"><div class="wallet-card ${selectedSend==key?'selected':''}" onclick="selectSend('${key}')"><div class="fs-4">${wallets[key].icon}</div><small>${wallets[key].name}</small></div></div>`;
    getHtml += `<div class="col-3 col-md-1-5"><div class="wallet-card ${selectedGet==key?'selected':''}" onclick="selectGet('${key}')"><div class="fs-4">${wallets[key].icon}</div><small>${wallets[key].name}</small></div></div>`;
  }
  sendWallets.innerHTML = sendHtml;
  getWallets.innerHTML = getHtml;
}

function selectSend(key){ selectedSend = key; sendCurrency.innerText = wallets[key].type; renderWallets(); calculate(); }
function selectGet(key){ selectedGet = key; getCurrency.innerText = wallets[key].type; renderWallets(); calculate(); }

function swapWallets(){
  let temp = selectedSend;
  selectedSend = selectedGet;
  selectedGet = temp;
  renderWallets(); calculate();
}

function calculate(){
  let amount = parseFloat(sendAmount.value) || 0;
  if(!rates[selectedSend] ||!rates[selectedGet]) return;

  let result = 0;
  // USD to BDT
  if(wallets[selectedSend].type == 'USD' && wallets[selectedGet].type == 'BDT'){
    result = amount * rates[selectedSend].sell;
  }
  // BDT to USD
  if(wallets[selectedSend].type == 'BDT' && wallets[selectedGet].type == 'USD'){
    result = amount / rates[selectedGet].buy;
  }
  // USD to USD
  if(wallets[selectedSend].type == 'USD' && wallets[selectedGet].type == 'USD'){
    result = amount * (rates[selectedSend].sell / rates[selectedGet].buy);
  }
  // BDT to BDT
  if(wallets[selectedSend].type == 'BDT' && wallets[selectedGet].type == 'BDT'){
    result = amount * (rates[selectedSend].sell / rates[selectedGet].buy);
  }

  getAmount.value = result.toFixed(2);
}

sendAmount.addEventListener('input', calculate);

function goToOrder(){
  if(sendAmount.value <= 0){ alert('Amount দিন'); return; }
  localStorage.setItem('exchangeData', JSON.stringify({
    send: { wallet: selectedSend, amount: sendAmount.value },
    get: { wallet: selectedGet, amount: getAmount.value }
  }));
  window.location.href = 'order.html';
}
</script>
</body>
</html>
