<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Order - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { background: #0f0f1a; font-family: 'Poppins', sans-serif; color: #fff; }
.order-card { background:#1a1a2e; padding:40px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.3); margin-top:50px; border: 1px solid #2e2e4e; }
.form-control,.form-select { background: #0f0f1a; border: 1px solid #2e2e4e; color: #fff; }
.form-control:focus { background: #0f0f1a; border-color: #10b981; color: #fff; box-shadow: none; }
.form-control[readonly] { background: #121220; }
.form-label { color: #aaa; }
.btn-success { background: #10b981; border: none; }
.navbar-brand { color: #fff!important; font-weight: 700; }
</style>
</head>
<body>

<nav class="navbar navbar-dark" style="background: #0f0f1a;">
<div class="container">
<a class="navbar-brand fs-3" href="index.html"><i class="fa fa-shield-halved text-warning"></i> TS Dollar Exchange</a>
<a href="index.html" class="btn btn-outline-light btn-sm">Back to Home</a>
</div>
</nav>

<div class="container">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="order-card">
<h3 class="text-center mb-4"><i class="fa fa-lock text-success"></i> Complete Your Order</h3>

<form id="orderForm">
<div class="mb-3">
<label class="form-label">Your Full Name</label>
<input type="text" id="name" class="form-control" placeholder="Enter Your Name" required>
</div>

<div class="mb-3">
<label class="form-label">Your Email</label>
<input type="email" id="email" class="form-control" placeholder="Enter Your Email" required readonly>
</div>

<div class="mb-3">
<label class="form-label">You Send</label>
<input id="sendWallet" class="form-control" readonly>
</div>

<div class="mb-3">
<label class="form-label">Amount (USD)</label>
<input id="sendAmount" type="number" class="form-control" readonly>
</div>

<div class="mb-3">
<label class="form-label">You Will Receive (BDT)</label>
<input id="getAmount" type="text" class="form-control" readonly>
</div>

<div class="mb-3">
<label class="form-label">You Will Receive in</label>
<input id="getWallet" class="form-control" readonly>
</div>

<div class="mb-4">
<label for="walletAddress" id="walletLabel" class="form-label">Your Wallet Address / Number</label>
<input type="text" id="walletAddress" class="form-control" placeholder="Bkash/Nagad/Bank Number" required>
</div>

<button type="submit" class="btn btn-success w-100 btn-lg fw-bold">Confirm & Submit Order</button>
<p id="submitMsg" class="text-center mt-3"></p>
</form>

</div>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt: { name: "USDT" }, payoneer: { name: "Payoneer" }, wise: { name: "Wise" }, skrill: { name: "Skrill" },
  bkash: { name: "Bkash" }, nagad: { name: "Nagad" }, rocket: { name: "Rocket" }, upay: { name: "Upay" }
};

window.onload = function() {
  auth.onAuthStateChanged(user => {
    if(user){
      let userName = user.displayName || user.email.split('@')[0];
      userName = userName.replace('.', ' ').replace('_', ' ');
      userName = userName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
      document.getElementById('name').value = userName;
      document.getElementById('email').value = user.email || '';

      const savedData = localStorage.getItem('exchangeData');
      if(savedData){
        const data = JSON.parse(savedData);
        document.getElementById('sendWallet').value = wallets[data.send.wallet].name;
        document.getElementById('sendAmount').value = data.send.amount;
        document.getElementById('getWallet').value = wallets[data.get.wallet].name;
        document.getElementById('getAmount').value = data.get.amount + ' BDT';

        let walletName = wallets[data.get.wallet].name;
        document.getElementById('walletLabel').innerText = "Your " + walletName + " Address / Number";
        let hint = (data.get.wallet === 'bkash' || data.get.wallet === 'nagad' || data.get.wallet === 'rocket' || data.get.wallet === 'upay')? 'Number' : 'Email/Address';
        document.getElementById('walletAddress').placeholder = "Enter your " + walletName + " + hint;
      } else {
        alert("Please select exchange from home page first");
        window.location.href = 'index.html';
      }
    } else {
      window.location.href = 'customer.html';
    }
  });
}

document.getElementById('orderForm').onsubmit = (e) => {
  e.preventDefault();
  submitMsg.innerHTML = "Submitting...";
  submitMsg.className = "text-warning";
  const user = auth.currentUser;

  const orderData = {
    name: name.value, email: email.value, sendWallet: sendWallet.value,
    sendAmount: sendAmount.value, getWallet: getWallet.value, getAmount: getAmount.value,
    walletAddress: walletAddress.value, status: "Pending", createdAt: Date.now()
  };

  db.ref('orders/'+user.uid).push(orderData)
.then(()=>{ submitMsg.innerHTML = "✅ Order Submitted Successfully!"; submitMsg.className = "text-success fw-bold"; localStorage.removeItem('exchangeData'); setTimeout(()=> window.location.href = 'index.html', 2000); })
.catch(e=>{ submitMsg.innerHTML = "❌ Error: "+e.message; submitMsg.className = "text-danger fw-bold"; })
}
</script>
</body>
</html>
