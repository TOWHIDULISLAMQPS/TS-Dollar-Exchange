<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Dollar Exchange - Fast & Secure</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
.navbar { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
.main-card { border-radius: 24px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); background: #fff; }
.wallet-card { cursor: pointer; border: 2px solid #e9ecef; transition: 0.3s; border-radius: 12px; padding: 12px; text-align: center; background: #fff; }
.wallet-card:hover { border-color: #667eea; transform: translateY(-2px); }
.wallet-card.selected { border-color: #00a859; background: linear-gradient(135deg, #e8f5e9, #d1fae5); }
.swap-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 20px; box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
.input-box { background: #f8f9fa; border-radius: 12px; padding: 15px; border: 1px solid #dee2e6; }
.rate-table, .recent-orders { background: #f8f9fa; border-radius: 16px; padding: 20px; }
.rate-item, .order-item { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 8px; border-left: 4px solid #667eea; animation: fadeIn 0.5s; }
@keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
@keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.6;} 100% {opacity: 1;} }
.pending { animation: pulse 1.5s infinite; border-left-color: #ffc107 !important; }
.contact-box { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; border-radius: 16px; padding: 20px; text-align: center; }
.whatsapp-btn { background: #fff; color: #25D366; font-weight: 700; border-radius: 50px; padding: 12px 25px; text-decoration: none; display: inline-block; transition: 0.3s; }
.whatsapp-btn:hover { transform: scale(1.05); color: #128C7E; }
.badge-warning { background: #ffc107; color: #000; }
.badge-success { background: #00a859; }
</style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3" href="#"><i class="bi bi-cash-coin"></i> TS Dollar Exchange</a>
  </div>
</nav>

<div class="container my-5">
  <div class="main-card p-4 p-md-5">
    <h3 class="text-center fw-bold mb-4">⚡ Instant Exchange</h3>

    <!-- YOU SEND -->
    <div class="mb-4">
      <label class="fw-semibold mb-2">You Send</label>
      <div class="input-box d-flex align-items-center mb-3">
        <input type="number" id="sendAmount" class="form-control border-0 bg-transparent fs-4" placeholder="0.00">
        <span id="sendCurrency" class="fw-bold fs-5 ms-2">USD</span>
      </div>
      <div class="row g-2" id="sendWallets"></div>
    </div>

    <!-- SWAP BUTTON -->
    <div class="text-center my-3">
      <button class="swap-btn" onclick="swapWallets()"><i class="bi bi-arrow-down-up"></i></button>
    </div>

    <!-- YOU GET -->
    <div class="mb-4">
      <label class="fw-semibold mb-2">You Get</label>
      <div class="input-box d-flex align-items-center mb-3">
        <input type="text" id="getAmount" class="form-control border-0 bg-transparent fs-4" placeholder="0.00" readonly>
        <span id="getCurrency" class="fw-bold fs-5 ms-2">BDT</span>
      </div>
      <div class="row g-2" id="getWallets"></div>
    </div>

    <button class="btn btn-success btn-lg w-100 fw-bold" style="background: linear-gradient(135deg, #00a859, #007b4f);" onclick="goToOrder()">Exchange Now <i class="bi bi-arrow-right"></i></button>
  </div>

  <!-- LIVE RATE TABLE -->
  <div class="rate-table mt-4">
    <h5 class="fw-bold mb-3 text-center"><i class="bi bi-graph-up-arrow"></i> Live Exchange Rates</h5>
    <div id="rateList"></div>
    <small class="text-muted">* Rates updated every minute. For bulk orders contact us.</small>
  </div>

  <!-- RECENT ORDERS -->
  <div class="recent-orders mt-4">
    <h5 class="fw-bold mb-3 text-center"><i class="bi bi-lightning-charge-fill text-warning"></i> Recent Orders <span class="badge bg-primary">Live</span></h5>
    <div id="recentOrderList"></div>
  </div>

  <!-- CONTACT + WHATSAPP -->
  <div class="contact-box mt-4">
    <h5 class="fw-bold"><i class="bi bi-headset"></i> 24/7 Support</h5>
    <p class="mb-3">Any Problem? Contact us on WhatsApp</p>
    <a href="https://wa.me/8801726858565" target="_blank" class="whatsapp-btn">
      <i class="bi bi-whatsapp"></i> 01726-858565
    </a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const wallets = {
  usdt: { name: "USDT", type: "USD", icon: "₮" },
  payoneer: { name: "Payoneer", type: "USD", icon: "P" },
  wise: { name: "Wise", type: "USD", icon: "W" },
  skrill: { name: "Skrill", type: "USD", icon: "S" },
  bkash: { name: "Bkash", type: "BDT", icon: "bK" },
  nagad: { name: "Nagad", type: "BDT", icon: "N" },
  rocket: { name: "Rocket", type: "BDT", icon: "R" },
  upay: { name: "Upay", type: "BDT", icon: "U" }
};

let rates = {};
let selectedSend = 'payoneer';
let selectedGet = 'bkash';
let orderList = []; // 10 ta order rakhar jonno

db.ref('rates/wallets').on('value',(snap)=>{
  rates = snap.val() || {};
  renderWallets();
  renderRates();
  calculate();
});

function renderWallets(){
  let sendHtml = '', getHtml = '';
  for(let key in wallets){
    sendHtml += `<div class="col-3 col-lg-1-5"><div class="wallet-card ${selectedSend==key?'selected':''}" onclick="selectSend('${key}')"><div class="fs-4 fw-bold">${wallets[key].icon}</div><small>${wallets[key].name}</small></div></div>`;
    getHtml += `<div class="col-3 col-lg-1-5"><div class="wallet-card ${selectedGet==key?'selected':''}" onclick="selectGet('${key}')"><div class="fs-4 fw-bold">${wallets[key].icon}</div><small>${wallets[key].name}</small></div></div>`;
  }
  sendWallets.innerHTML = sendHtml;
  getWallets.innerHTML = getHtml;
}

function renderRates(){
  let html = '';
  for(let key in rates){
    html += `<div class="rate-item d-flex justify-content-between">
      <span class="fw-semibold">${wallets[key].name}</span>
      <span>Buy: <b class="text-success">${rates[key].buy}</b> | Sell: <b class="text-danger">${rates[key].sell}</b> BDT</span>
    </div>`;
  }
  rateList.innerHTML = html;
}

function selectSend(key){ selectedSend = key; sendCurrency.innerText = wallets[key].type; renderWallets(); calculate(); }
function selectGet(key){ selectedGet = key; getCurrency.innerText = wallets[key].type; renderWallets(); calculate(); }

function swapWallets(){
  let temp = selectedSend;
  selectedSend = selectedGet;
  selectedGet = temp;
  renderWallets(); calculate();
}

function calculate(){
  let amount = parseFloat(sendAmount.value) || 0;
  if(!rates[selectedSend] ||!rates[selectedGet]) return;
  let result = 0;
  if(wallets[selectedSend].type == 'USD' && wallets[selectedGet].type == 'BDT'){
    result = amount * rates[selectedSend].sell;
  }
  if(wallets[selectedSend].type == 'BDT' && wallets[selectedGet].type == 'USD'){
    result = amount / rates[selectedGet].buy;
  }
  if(wallets[selectedSend].type == 'USD' && wallets[selectedGet].type == 'USD'){
    result = amount * (rates[selectedSend].sell / rates[selectedGet].buy);
  }
  if(wallets[selectedSend].type == 'BDT' && wallets[selectedGet].type == 'BDT'){
    result = amount * (rates[selectedSend].sell / rates[selectedGet].buy);
  }
  getAmount.value = result.toFixed(2);
}

sendAmount.addEventListener('input', calculate);

function goToOrder(){
  if(sendAmount.value <= 0){ alert('Amount দিন'); return; }
  localStorage.setItem('exchangeData', JSON.stringify({
    send: { wallet: selectedSend, amount: sendAmount.value },
    get: { wallet: selectedGet, amount: getAmount.value }
  }));
  window.location.href = 'order.html';
}

// ===== FAKE RANDOM ORDER SYSTEM WITH PENDING =====
const names = ["Rahim", "Karim", "Sadia", "Nayeem", "Fatema", "Jamal", "Tanvir", "Mim", "Shohan", "Rupa", "Sakib", "Nusrat"];
const cities = ["Dhaka", "Chittagong", "Sylhet", "Khulna", "Rajshahi", "Barisal", "Rangpur", "Comilla"];

function createOrderObject(){
  const walletKeys = Object.keys(wallets);
  const send = walletKeys[Math.floor(Math.random() * walletKeys.length)];
  let get;
  do { get = walletKeys[Math.floor(Math.random() * walletKeys.length)]; } while(get == send);
  
  return {
    id: Date.now() + Math.random(),
    name: names[Math.floor(Math.random() * names.length)],
    city: cities[Math.floor(Math.random() * cities.length)],
    amount: (Math.random() * 500 + 10).toFixed(2),
    send: send,
    get: get,
    status: 'pending', // শুরুতে pending
    time: 0 // 3 sec por complete hobe
  };
}

function renderOrders(){
  let html = '';
  orderList.slice(0, 10).forEach(order => {
    const badge = order.status == 'pending' 
      ? `<span class="badge badge-warning">Pending</span>` 
      : `<span class="badge badge-success">Completed</span>`;
    const itemClass = order.status == 'pending' ? 'order-item pending' : 'order-item';
    
    html += `<div class="${itemClass}" id="order-${order.id}">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <b>${order.name}</b> from ${order.city}<br>
          <small>${order.amount} ${wallets[order.send].name} → ${wallets[order.get].name}</small>
        </div>
        ${badge}
      </div>
    </div>`;
  });
  recentOrderList.innerHTML = html;
}

// প্রতি 4-6 সেকেন্ড পর নতুন Order Add
setInterval(() => {
  const newOrder = createOrderObject();
  orderList.unshift(newOrder); // উপরে Add
  if(orderList.length > 10) orderList.pop(); // 10 tar beshi hole last ta bad
  renderOrders();
}, 4000 + Math.random() * 2000);

// প্রতি 1 সেকেন্ড পর Pending → Completed চেক
setInterval(() => {
  orderList.forEach(order => {
    order.time++;
    if(order.status == 'pending' && order.time >= 3){ // 3 sec por complete
      order.status = 'completed';
    }
  });
  renderOrders();
}, 1000);

// Page load e 5 ta order diye start
for(let i=0; i<5; i++) orderList.push(createOrderObject());
renderOrders();

</script>
</body>
</html>
