<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login - TS Dollar Exchange</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #581c87 100%);
  color:#fff;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.auth-box{
  width:450px;
  background:rgba(30,41,59,0.85);
  padding:40px;
  border-radius:24px;
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 25px 70px rgba(0,0,0,0.5);
}
.btn-primary{
  background:linear-gradient(135deg, #4f46e5, #8b5cf6);
  border:none;
  border-radius:12px;
}
.btn-success{
  background:linear-gradient(135deg, #10b981, #059669);
  border:none;
  border-radius:12px;
}
.form-control{
  background:#0f172a !important;
  border:1px solid #334155;
  color:#fff !important;
  border-radius:10px;
  height:50px;
}
.nav-pills .nav-link{
  color:#cbd5e1;
  border-radius:10px;
  font-weight:600;
}
.nav-pills .nav-link.active{
  background:linear-gradient(135deg, #4f46e5, #8b5cf6);
  color:#fff;
}
</style>
</head>
<body>

<div class="auth-box">
  <h3 class="text-center mb-4 fw-bold"><i class="bi bi-shield-shaded text-warning"></i> TS Customer</h3>
  
  <!-- TABS -->
  <ul class="nav nav-pills nav-fill mb-4">
    <li class="nav-item"><button class="nav-link active" id="loginTab" type="button">Login</button></li>
    <li class="nav-item"><button class="nav-link" id="signupTab" type="button">Sign Up</button></li>
  </ul>

  <!-- LOGIN FORM -->
  <form id="loginForm">
    <input id="loginEmail" type="email" placeholder="Enter Email" class="form-control mb-3" required>
    <input id="loginPass" type="password" placeholder="Enter Password" class="form-control mb-3" required>
    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Login</button>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signupForm" style="display:none;">
    <input id="signupName" type="text" placeholder="Full Name" class="form-control mb-3" required>
    <input id="signupEmail" type="email" placeholder="Email Address" class="form-control mb-3" required>
    <input id="signupPhone" type="text" placeholder="WhatsApp Number" class="form-control mb-3" required>
    <input id="signupPass" type="password" placeholder="Create Password" class="form-control mb-3" required>
    <button type="submit" class="btn btn-success w-100 fw-bold py-2">Create Account</button>
  </form>

  <p id="authMsg" class="text-center mt-3"></p>
  <a href="index.html" class="d-block text-center mt-3 text-info"><i class="bi bi-arrow-left"></i> Back to Home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Tab Switch
loginTab.onclick = () => {
  loginForm.style.display='block'; 
  signupForm.style.display='none'; 
  loginTab.classList.add('active'); 
  signupTab.classList.remove('active');
}
signupTab.onclick = () => {
  signupForm.style.display='block'; 
  loginForm.style.display='none'; 
  signupTab.classList.add('active'); 
  loginTab.classList.remove('active');
}

// SIGNUP
signupForm.onsubmit = (e) => {
  e.preventDefault();
  authMsg.innerHTML = "Creating...";
  auth.createUserWithEmailAndPassword(signupEmail.value, signupPass.value)
  .then(cred => {
    // Save user info to DB
    db.ref('users/'+cred.user.uid).set({
      name: signupName.value,
      email: signupEmail.value,
      phone: signupPhone.value,
      createdAt: Date.now()
    });
    authMsg.innerHTML = "✅ Account Created Successfully!";
    authMsg.className="text-success";
    setTimeout(()=>window.location='customer-dashboard.html', 1500);
  })
  .catch(e=>{ 
    authMsg.innerHTML="❌ Error: "+e.message; 
    authMsg.className="text-danger"; 
  })
}

// LOGIN
loginForm.onsubmit = (e) => {
  e.preventDefault();
  authMsg.innerHTML = "Logging in...";
  auth.signInWithEmailAndPassword(loginEmail.value, loginPass.value)
  .then(()=>{ 
    window.location='customer-dashboard.html'; 
  })
  .catch(e=>{ 
    authMsg.innerHTML="❌ Error: "+e.message; 
    authMsg.className="text-danger"; 
  })
}

// Already logged in?
auth.onAuthStateChanged(user => {
  if(user){ window.location='customer-dashboard.html'; }
})
</script>
</body>
</html>
