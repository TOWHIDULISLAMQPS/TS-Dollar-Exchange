<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{
  background: linear-gradient(135deg, #0c0c2e 0%, #1a1a4a 50%, #4a148c 100%);
  color:#fff;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow: hidden;
}
body::before{
  content:''; position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(138,43,226,0.3) 0%, transparent 70%);
  top: -200px; left: -200px; animation: float 8s infinite ease-in-out;
}
body::after{
  content:''; position: absolute; width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(79,70,229,0.3) 0%, transparent 70%);
  bottom: -150px; right: -150px; animation: float 10s infinite ease-in-out;
}
@keyframes float { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-30px);} }

.login-box{
  max-width:450px;
  width:90%;
  background: rgba(20, 20, 40, 0.6);
  padding:45px 35px;
  border-radius:24px;
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 25px 70px rgba(0,0,0,0.6);
  position: relative; z-index: 2;
}
.form-control{
  background: rgba(15,23,42,0.8) !important;
  border:1px solid #334155;
  color:#fff !important;
  border-radius:12px;
  height:50px;
  padding-left: 15px;
}
.form-control:focus{
  background: rgba(15,23,42,1) !important;
  border-color: #8b5cf6;
  box-shadow: 0 0 0 3px rgba(139,92,246,0.3);
}
label{ color:#cbd5e1; font-weight:600; }
.btn-primary{
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  border:none;
  border-radius:12px;
  height:50px;
  font-weight: 700;
  transition: 0.3s;
}
.btn-primary:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(139,92,246,0.4);
}
.btn-success{
  background: linear-gradient(135deg, #10b981, #059669);
  border:none;
  border-radius:12px;
  height:50px;
  font-weight: 700;
}
a{ color: #a5b4fc; text-decoration: none; }
a:hover{ color: #fff; text-decoration: underline; }
</style>
</head>
<body>

<div class="login-box">
  <h3 class="text-center mb-4 fw-bold"><i class="bi bi-person-circle text-primary"></i> Login / Signup</h3>
  
  <!-- LOGIN FORM -->
  <div id="loginForm">
    <div class="mb-3">
      <label>Email</label>
      <input id="loginEmail" type="email" class="form-control" placeholder="Enter Email" required>
    </div>
    <div class="mb-3">
      <label>Password</label>
      <input id="loginPassword" type="password" class="form-control" placeholder="Enter Password" required>
    </div>
    <button id="loginBtn" class="btn btn-primary w-100">Login</button>
    <p class="text-center mt-3">Don't have account? <a href="#" onclick="showSignup()">Sign Up</a></p>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signupForm" style="display:none;">
    <div class="mb-3">
      <label>Full Name</label>
      <input id="signupName" type="text" class="form-control" placeholder="Enter Name" required>
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input id="signupEmail" type="email" class="form-control" placeholder="Enter Email" required>
    </div>
    <div class="mb-3">
      <label>Password</label>
      <input id="signupPassword" type="password" class="form-control" placeholder="Min 6 characters" required>
    </div>
    <button id="signupBtn" class="btn btn-success w-100">Create Account</button>
    <p class="text-center mt-3">Already have account? <a href="#" onclick="showLogin()">Login</a></p>
  </div>

  <p id="authMsg" class="text-center mt-3"></p>
  <a href="index.html" class="d-block text-center mt-2"><i class="bi bi-arrow-left"></i> Back to Home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Show/Hide Forms
function showSignup(){ loginForm.style.display='none'; signupForm.style.display='block'; }
function showLogin(){ signupForm.style.display='none'; loginForm.style.display='block'; }

// ========= LOGIN CODE =========
document.getElementById('loginBtn').onclick = () => {
  const email = loginEmail.value;
  const password = loginPassword.value;
  authMsg.innerHTML = "Logging in...";

  auth.signInWithEmailAndPassword(email, password)
  .then((userCredential) => {
    authMsg.innerHTML = "✅ Login Successful!";
    authMsg.className = "text-success";
    setTimeout(() => {
      window.location.href = 'index.html'; // LOGIN ER POR HOME E PATHABE
    }, 1000);
  })
  .catch((error) => {
    authMsg.innerHTML = "❌ " + error.message;
    authMsg.className = "text-danger";
  });
}

// ========= SIGNUP CODE =========
document.getElementById('signupBtn').onclick = () => {
  const name = signupName.value;
  const email = signupEmail.value;
  const password = signupPassword.value;
  authMsg.innerHTML = "Creating account...";

  auth.createUserWithEmailAndPassword(email, password)
  .then((userCredential) => {
    userCredential.user.updateProfile({ displayName: name });
    db.ref('users/'+userCredential.user.uid).set({
      name: name, email: email, createdAt: Date.now()
    });
    authMsg.innerHTML = "✅ Account Created!";
    authMsg.className = "text-success";
    setTimeout(() => {
      window.location.href = 'index.html'; 
    }, 1000);
  })
  .catch((error) => {
    authMsg.innerHTML = "❌ " + error.message;
    authMsg.className = "text-danger";
  });
}
</script>
</body>
</html>
