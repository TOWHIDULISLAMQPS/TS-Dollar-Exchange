<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{
  background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 50%, #3a0a5a 100%);
  color:#fff;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow: hidden;
  position: relative;
}
.particles { position: absolute; width: 100%; height: 100%; overflow: hidden; }
.particle { position: absolute; background: rgba(139,92,246,0.3); border-radius: 50%; animation: floatUp 15s infinite linear; }
@keyframes floatUp { from{transform: translateY(100vh) scale(0);} to{transform: translateY(-10vh) scale(1);} }

.login-box{
  max-width:450px;
  width:90%;
  background: rgba(20, 20, 40, 0.5);
  padding:40px 30px;
  border-radius:20px;
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 25px 70px rgba(0,0,0,0.7), 0 0 0 1px rgba(139,92,246,0.2);
  position: relative; z-index: 2;
  max-height: 90vh; overflow-y: auto;
}
.form-control{
  background: rgba(10,15,30,0.8) !important;
  border:1px solid #2d3748;
  color:#fff !important;
  border-radius:10px;
  height:48px;
  padding-left: 15px;
}
textarea.form-control{ height: 80px; }
.form-control:focus{
  background: rgba(10,15,30,1) !important;
  border-color: #8b5cf6;
  box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
}
label{ color:#a0aec0; font-weight:600; font-size: 14px; }
.btn-green{
  background: linear-gradient(135deg, #10b981, #059669);
  border:none;
  border-radius:10px;
  height:48px;
  font-weight: 700;
  transition: 0.3s;
}
.btn-green:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(16,185,129,0.4);
}
.password-wrapper{ position: relative; }
.password-toggle{ position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #a0aec0; }
a{ color: #a5b4fc; text-decoration: none; font-size: 14px; }
a:hover{ color: #fff; text-decoration: underline; }
.divider{ display: flex; align-items: center; text-align: center; color: #718096; font-size: 12px; }
.divider::before, .divider::after{ content: ''; flex: 1; border-bottom: 1px solid #2d3748; }
</style>
</head>
<body>

<!-- Animated Particles -->
<div class="particles">
  <div class="particle" style="width: 10px; height: 10px; left: 10%; animation-duration: 12s;"></div>
  <div class="particle" style="width: 15px; height: 15px; left: 30%; animation-duration: 18s;"></div>
  <div class="particle" style="width: 8px; height: 8px; left: 60%; animation-duration: 14s;"></div>
  <div class="particle" style="width: 12px; height: 12px; left: 80%; animation-duration: 16s;"></div>
</div>

<div class="login-box">
  <h3 class="text-center mb-4 fw-bold"><i class="bi bi-person-circle text-primary"></i> Login / Signup</h3>
  
  <!-- LOGIN FORM -->
  <div id="loginForm">
    <div class="mb-3">
      <label>Email</label>
      <input id="loginEmail" type="email" class="form-control" placeholder="Enter Email" required>
    </div>
    <div class="mb-3">
      <label>Password</label>
      <div class="password-wrapper">
        <input id="loginPassword" type="password" class="form-control" placeholder="Enter Password" required>
        <i class="bi bi-eye password-toggle" onclick="togglePassword('loginPassword', this)"></i>
      </div>
    </div>
    <button id="loginBtn" class="btn btn-green w-100"><span class="btn-text">Login</span> <span class="spinner-border spinner-border-sm d-none"></span></button>
    <p class="text-center mt-3">Don't have account? <a href="#" onclick="showSignup()">Sign Up</a></p>
  </div>

  <!-- SIGNUP FORM WITH MOBILE + ADDRESS -->
  <div id="signupForm" style="display:none;">
    <div class="mb-3">
      <label>Full Name</label>
      <input id="signupName" type="text" class="form-control" placeholder="Enter Name" required>
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input id="signupEmail" type="email" class="form-control" placeholder="Enter Email" required>
    </div>
    <div class="mb-3">
      <label>Mobile Number</label>
      <input id="signupMobile" type="tel" class="form-control" placeholder="01XXXXXXXXX" required>
    </div>
    <div class="mb-3">
      <label>Address</label>
      <textarea id="signupAddress" class="form-control" placeholder="Your Full Address" required></textarea>
    </div>
    <div class="mb-3">
      <label>Password</label>
      <div class="password-wrapper">
        <input id="signupPassword" type="password" class="form-control" placeholder="Min 6 characters" required>
        <i class="bi bi-eye password-toggle" onclick="togglePassword('signupPassword', this)"></i>
      </div>
    </div>
    <button id="signupBtn" class="btn btn-green w-100"><span class="btn-text">Create Account</span> <span class="spinner-border spinner-border-sm d-none"></span></button>
    <p class="text-center mt-3">Already have account? <a href="#" onclick="showLogin()">Login</a></p>
  </div>

  <p id="authMsg" class="text-center mt-3"></p>
  <a href="index.html" class="d-block text-center mt-2"><i class="bi bi-arrow-left"></i> Back to Home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Show/Hide Forms
function showSignup(){ loginForm.style.display='none'; signupForm.style.display='block'; }
function showLogin(){ signupForm.style.display='none'; loginForm.style.display='block'; }

// Password Toggle
function togglePassword(id, el){
  const input = document.getElementById(id);
  if(input.type === 'password'){ input.type = 'text'; el.classList.replace('bi-eye', 'bi-eye-slash'); }
  else { input.type = 'password'; el.classList.replace('bi-eye-slash', 'bi-eye'); }
}

// Loading Button
function setLoading(btn, loading){
  btn.querySelector('.btn-text').classList.toggle('d-none', loading);
  btn.querySelector('.spinner-border').classList.toggle('d-none', !loading);
  btn.disabled = loading;
}

// ========= LOGIN CODE =========
document.getElementById('loginBtn').onclick = () => {
  const email = loginEmail.value;
  const password = loginPassword.value;
  const btn = document.getElementById('loginBtn');
  setLoading(btn, true);
  authMsg.innerHTML = "";

  auth.signInWithEmailAndPassword(email, password)
  .then((userCredential) => {
    authMsg.innerHTML = "✅ Login Successful!";
    authMsg.className = "text-success";
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  })
  .catch((error) => {
    authMsg.innerHTML = "❌ " + error.message;
    authMsg.className = "text-danger";
    setLoading(btn, false);
  });
}

// ========= UPDATED SIGNUP CODE WITH MOBILE + ADDRESS =========
document.getElementById('signupBtn').onclick = () => {
  const name = signupName.value;
  const email = signupEmail.value;
  const mobile = signupMobile.value;
  const address = signupAddress.value;
  const password = signupPassword.value;
  const btn = document.getElementById('signupBtn');
  
  if(!mobile || !address){
    authMsg.innerHTML = "❌ Mobile & Address required";
    authMsg.className = "text-danger";
    return;
  }

  setLoading(btn, true);
  authMsg.innerHTML = "";

  auth.createUserWithEmailAndPassword(email, password)
  .then((userCredential) => {
    userCredential.user.updateProfile({ displayName: name });
    
    // EKHANE MOBILE + ADDRESS SAVE HOBE FIREBASE E
    db.ref('users/'+userCredential.user.uid).set({
      name: name, 
      email: email, 
      mobile: mobile,
      address: address,
      createdAt: Date.now()
    });

    authMsg.innerHTML = "✅ Account Created!";
    authMsg.className = "text-success";
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  })
  .catch((error) => {
    authMsg.innerHTML = "❌ " + error.message;
    authMsg.className = "text-danger";
    setLoading(btn, false);
  });
}
</script>
</body>
</html>
