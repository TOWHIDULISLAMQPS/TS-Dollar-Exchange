<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Order - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #581c87 100%);
  color:#fff;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  padding:40px 0;
}
.order-box{
  max-width:600px;
  margin:auto;
  background:rgba(30,41,59,0.85);
  padding:40px;
  border-radius:24px;
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 25px 70px rgba(0,0,0,0.5);
}
.form-control, .form-select{
  background:#0f172a !important;
  border:1px solid #334155;
  color:#fff !important;
  border-radius:10px;
  height:50px;
}
label{ color:#cbd5e1; font-weight:600; }
.btn-success{
  background:linear-gradient(135deg, #10b981, #059669);
  border:none;
  border-radius:12px;
  height:50px;
}
</style>
</head>
<body>

<div class="order-box">
  <h3 class="text-center mb-4 fw-bold"><i class="bi bi-bag-check-fill text-success"></i> Complete Your Order</h3>
  
  <form id="orderForm">
    <div class="mb-3">
      <label>Your Full Name</label>
      <input id="name" type="text" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Your Email</label>
      <input id="email" type="email" class="form-control" readonly>
    </div>
    <div class="mb-3">
      <label>You Send</label>
      <select id="sendWallet" class="form-select">
        <option value="Payoneer">Payoneer</option>
        <option value="Wise">Wise</option>
        <option value="USDT">USDT</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Amount (USD)</label>
      <input id="amount" type="number" class="form-control" placeholder="Enter Amount" required>
    </div>
    <div class="mb-3">
      <label>You Will Receive (BDT)</label>
      <input id="receiveAmount" type="text" class="form-control" readonly>
    </div>
    <div class="mb-3">
      <label>You Will Receive in</label>
      <select id="receiveWallet" class="form-select">
        <option value="Bkash">Bkash</option>
        <option value="Nagad">Nagad</option>
        <option value="Bank">Bank</option>
      </select>
    </div>
    <div class="mb-3">
      <label>Your Wallet Address / Number</label>
      <input id="walletAddress" type="text" placeholder="Bkash/Nagad/Bank Number" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success w-100 fw-bold">Confirm & Submit Order</button>
  </form>

  <p id="orderMsg" class="text-center mt-3"></p>
  <a href="index.html" class="d-block text-center mt-3 text-info"><i class="bi bi-arrow-left"></i> Back to Home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const rate = 122; // 1 USD = 122 BDT

// ========= NEW AUTO-FILL CODE START =========
window.onload = function() {
  auth.onAuthStateChanged(user => {
    if(user){
      // 1. Auto fill Name and Email from Firebase
      document.getElementById('name').value = user.displayName || '';
      document.getElementById('email').value = user.email || '';

      // 2. Auto fill Wallet and Amount from index.html localStorage
      const savedWallet = localStorage.getItem('selectedWallet');
      const savedAmount = localStorage.getItem('selectedAmount');
      
      if(savedWallet) document.getElementById('sendWallet').value = savedWallet;
      if(savedAmount) document.getElementById('amount').value = savedAmount;
      
      // 3. Calculate BDT auto
      calculateBDT();
    } else {
      window.location.href = 'customer.html'; // login page e pathay dibe
    }
  });
}

function calculateBDT(){
  const usd = document.getElementById('amount').value;
  document.getElementById('receiveAmount').value = (usd * rate).toFixed(2) + " BDT";
}
document.getElementById('amount').oninput = calculateBDT;
// ========= NEW AUTO-FILL CODE END =========

// Order Submit
orderForm.onsubmit = (e) => {
  e.preventDefault();
  orderMsg.innerHTML = "Submitting...";
  const user = auth.currentUser;
  
  const orderData = {
    name: name.value,
    email: email.value,
    sendWallet: sendWallet.value,
    amount: amount.value,
    receiveAmount: receiveAmount.value,
    receiveWallet: receiveWallet.value,
    walletAddress: walletAddress.value,
    status: "Pending",
    createdAt: Date.now()
  };

  db.ref('orders/'+user.uid).push(orderData)
  .then(()=>{
    orderMsg.innerHTML = "✅ Order Submitted Successfully!";
    orderMsg.className = "text-success";
    localStorage.removeItem('selectedWallet'); // clean
    localStorage.removeItem('selectedAmount');
  })
  .catch(e=>{
    orderMsg.innerHTML = "❌ Error: "+e.message;
    orderMsg.className = "text-danger";
  })
}
</script>
</body>
</html>
