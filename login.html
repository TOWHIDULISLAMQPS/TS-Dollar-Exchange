<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#071826;display:flex;justify-content:center;align-items:center;height:100vh;}
.card{background:#1a2b3c;color:white;width:400px;padding:30px;border-radius:15px;}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

<div class="card">
<h3 class="text-center mb-4 text-primary">Admin Login</h3>
<input id="email" type="email" placeholder="Email" value="towhidulislamtuhin872@gmail.com" class="form-control bg-dark text-white mb-3">
<input id="password" type="password" placeholder="Password" class="form-control bg-dark text-white mb-3">
<button id="loginBtn" class="btn btn-primary w-100 fw-bold">Login</button>
<p id="error" class="text-danger text-center mt-2"></p>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
authDomain:"ts-dollar-exchange.firebaseapp.com",
databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const auth = firebase.auth();

document.getElementById('loginBtn').addEventListener('click', ()=>{
let email = document.getElementById('email').value;
let pass = document.getElementById('password').value;
document.getElementById('error').innerText = "Loading...";

auth.signInWithEmailAndPassword(email, pass).then(()=>{
window.location.href = "dashboard.html";
}).catch((error)=>{
document.getElementById('error').innerText = error.message;
});
})
</script>
</body>
</html>
