<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#071826;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
.card{background:#1a2b3c;color:white;width:400px;padding:30px;border-radius:15px;}
</style>
</head>
<body>

<div class="card">
<h3 class="text-center mb-4 text-primary">Admin Login</h3>
<input id="email" type="email" placeholder="Email" value="towhidulislamtuhin872@gmail.com" class="form-control bg-dark text-white mb-3">
<input id="password" type="password" placeholder="Password" class="form-control bg-dark text-white mb-3">
<button id="loginBtn" class="btn btn-primary w-100 fw-bold">Login</button>
<p id="status" class="text-center mt-3"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
const firebaseConfig = {
apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
authDomain:"ts-dollar-exchange.firebaseapp.com",
databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const status = document.getElementById('status');

document.getElementById('loginBtn').onclick = ()=>{
let email = document.getElementById('email').value;
let pass = document.getElementById('password').value;
status.className = "text-warning text-center mt-3";
status.innerText = "Loading...";

auth.signInWithEmailAndPassword(email, pass).then(()=>{
status.className = "text-success text-center mt-3";
status.innerText = "Login Success! Redirecting...";
setTimeout(()=>{window.location.href = "dashboard.html"}, 1000);
}).catch((error)=>{
status.className = "text-danger text-center mt-3";
status.innerText = "Error: " + error.message; // এখানে Error দেখাবে
});
}
</script>
</body>
</html>
