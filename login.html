<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg, #071826, #0d6efd);height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;}
.login-box{background:#fff;width:360px;padding:35px;border-radius:20px;box-shadow:0 15px 50px rgba(0,0,0,.4);}
h2{text-align:center;color:#0d6efd;margin-bottom:25px;font-weight:700;}
input{height:50px;margin-bottom:15px;font-size:16px;}
button{width:100%;height:50px;font-weight:600;font-size:18px;}
</style>
<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
<div class="login-box">
<h2>Admin Login</h2>
<input id="email" type="email" class="form-control" placeholder="Enter Email" value="towhidulislamtuhin872@gmail.com">
<input id="password" type="password" class="form-control" placeholder="Enter Password">
<button onclick="login()" class="btn btn-primary">Login</button>
<p id="msg" class="text-center mt-3 fw-bold"></p>
</div>

<script>
// তোমার Firebase Config
const firebaseConfig = {
apiKey: "AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
authDomain: "ts-dollar-exchange.firebaseapp.com",
databaseURL: "https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "ts-dollar-exchange",
storageBucket: "ts-dollar-exchange.firebasestorage.app",
messagingSenderId: "458864027860",
appId: "1:458864027860:web:adfe8163cbe6bddfbfb341"
};

// Firebase Start
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;
const msg = document.getElementById('msg');

if(!email || !password){
msg.innerHTML = "⚠️ Please enter Email and Password";
msg.className = "text-warning text-center mt-3 fw-bold";
return;
}

msg.innerHTML = "⏳ Logging in...";
msg.className = "text-info text-center mt-3 fw-bold";

auth.signInWithEmailAndPassword(email, password)
.then((userCredential) => {
msg.innerHTML = "✅ Login Success! Redirecting...";
msg.className = "text-success text-center mt-3 fw-bold";
setTimeout(() => {
window.location.href = "dashboard.html"; 
}, 1500);
})
.catch((error) => {
msg.innerHTML = "❌ Error: " + error.message;
msg.className = "text-danger text-center mt-3 fw-bold";
});
}
</script>
</body>
</html>
