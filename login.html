<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body style="background:#071826;display:flex;justify-content:center;align-items:center;height:100vh;">
<div style="background:white;padding:30px;border-radius:15px;width:300px;text-align:center;">
<h2 style="color:#0d6efd;">Admin Login</h2>
<input id="email" type="email" placeholder="Email" style="width:100%;height:45px;margin:10px 0;padding:10px;">
<input id="password" type="password" placeholder="Password" style="width:100%;height:45px;margin:10px 0;padding:10px;">
<button onclick="login()" style="width:100%;height:45px;background:#0d6efd;color:white;border:none;border-radius:8px;font-size:16px;">Login</button>
<p id="msg" style="margin-top:15px;font-weight:bold;"></p>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",authDomain:"ts-dollar-exchange.firebaseapp.com",databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"ts-dollar-exchange"});
const auth = firebase.auth();
function login(){
let e=document.getElementById('email').value;let p=document.getElementById('password').value;let m=document.getElementById('msg');
if(!e||!p){m.innerHTML="Email Password dao";m.style.color="orange";return;}
m.innerHTML="Loading...";m.style.color="blue";
auth.signInWithEmailAndPassword(e,p).then(()=>{m.innerHTML="Success!";m.style.color="green";setTimeout(()=>{location.href="dashboard.html"},1000);}).catch((er)=>{m.innerHTML=er.message;m.style.color="red";});
}
</script>
</body>
</html>
