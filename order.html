<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Order - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg1:#05051a; --bg2:#1a0a2e; --card:#12122a; --primary:#22c55e; --primary-glow:rgba(34,197,94,0.3); }
body{
  background: radial-gradient(1200px 800px at 20% -10%, #3b0764 0%, transparent 60%),
              radial-gradient(1200px 800px at 120% 110%, #1e1b4b 0%, transparent 60%),
              linear-gradient(135deg, var(--bg1), var(--bg2));
  color:#e2e8f0; font-family:'Outfit',sans-serif; min-height:100vh;
}
.topbar{ padding:14px 0; background:rgba(5,5,26,0.6); backdrop-filter: blur(20px); border-bottom:1px solid rgba(255,255,255,0.05); }
.brand{ font-weight: 800; font-size: 18px; color:#fff; }
.brand i{ color:#fbbf24; }

.order-wrap{ display:flex; align-items:center; justify-content:center; padding: 50px 15px; }
.order-card{
  width:100%; max-width: 480px;
  background: linear-gradient(180deg, rgba(18,18,42,0.9), rgba(12,12,30,0.9));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px;
  padding: 35px 30px;
  box-shadow: 0 0 0 1px rgba(34,197,94,0.1), 0 30px 80px rgba(0,0,0,0.6);
  animation: slideUp 0.5s ease;
}
@keyframes slideUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }

/* Floating Label Input */
.form-floating{ position: relative; margin-bottom: 18px; }
.form-floating input{
  background: rgba(5,8,20,0.8); border: 1.5px solid #1e293b; color:#fff;
  height: 52px; border-radius: 12px; padding: 20px 14px 8px;
}
.form-floating input:focus{
  background: rgba(5,8,20,1); border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
.form-floating label{
  position: absolute; top: 15px; left: 14px; color: #64748b;
  transition: 0.2s; pointer-events: none; font-size: 14px;
}
.form-floating input:focus ~ label,
.form-floating input:not(:placeholder-shown) ~ label{
  top: 6px; font-size: 11px; color: var(--primary);
}
input[readonly]{ opacity: 0.8; }

.btn-premium{
  background: linear-gradient(135deg, var(--primary), #16a34a);
  border: none; border-radius: 12px; height: 52px; font-weight: 700;
  box-shadow: 0 8px 25px var(--primary-glow);
  transition: 0.3s;
}
.btn-premium:hover{
  transform: translateY(-2px);
  box-shadow: 0 12px 35px var(--primary-glow);
}
.btn-premium:disabled{ opacity: 0.6; }
.back-link{ color: #38bdf8; font-size: 13px; text-decoration: none; }
.back-link:hover{ text-decoration: underline; }

/* NEW: Success Animation */
.success-check{ width:70px; height:70px; margin:0 auto 15px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; animation:pop 0.6s; }
@keyframes pop{ 0%{transform:scale(0);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }

/* NEW: If modal e thakle topbar hide korbe */
.in-modal.topbar{ display:none!important; }
.in-modal.order-wrap{ padding: 20px 15px!important; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="brand"><i class="bi bi-shield-shaded"></i> TS Dollar Exchange</div>
    <a href="index.html" class="btn btn-sm" style="border:1px solid #334155; color:#cbd5e1;"><i class="bi bi-house"></i> Back to Home</a>
  </div>
</div>

<div class="order-wrap">
  <div class="order-card">
    <h4 class="text-center mb-4 fw-bold"><i class="bi bi-lock-fill text-success"></i> Complete Your Order</h4>

    <div id="summaryBox" class="mb-4 p-3 rounded-3" style="background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); display:none;">
      <small class="text-info">Exchange Summary</small>
      <div class="d-flex justify-content-between mt-1">
        <span id="summarySend" class="fw-bold"></span>
        <i class="bi bi-arrow-right"></i>
        <span id="summaryGet" class="fw-bold text-success"></span>
      </div>
    </div>

    <form id="orderForm">
      <div class="form-floating">
        <input id="fullName" type="text" placeholder=" " required>
        <label>Your Full Name</label>
      </div>

      <div class="form-floating">
        <input id="email" type="email" placeholder=" " required>
        <label>Your Email</label>
      </div>

      <div class="form-floating">
        <input id="sendWallet" type="text" placeholder=" " readonly>
        <label>You Send</label>
      </div>

      <div class="form-floating">
        <input id="sendAmount" type="text" placeholder=" " readonly>
        <label>Amount</label>
      </div>

      <div class="form-floating">
        <input id="getAmount" type="text" placeholder=" " readonly>
        <label>You Will Receive</label>
      </div>

      <div class="form-floating">
        <input id="walletAddress" type="text" placeholder=" " required>
        <label>Your Wallet Address / Number</label>
      </div>

      <button type="submit" class="btn btn-premium w-100 mt-2">
        <i class="bi bi-check-circle"></i> Confirm & Submit Order
      </button>

      <div class="text-center mt-3" id="backBtnDiv">
        <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
      </div>
    </form>

    <div id="successBox" style="display:none;" class="text-center">
      <div class="success-check"><i class="bi bi-check-lg fs-1 text-white"></i></div>
      <h5 class="text-success fw-bold">Order Submitted!</h5>
      <p class="text-muted">We will contact you on WhatsApp within 2 minutes</p>
    </div>

    <p id="orderMsg" class="text-center mt-3"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt: "USDT", payoneer: "Payoneer", wise: "Wise", skrill: "Skrill",
  bkash: "Bkash", nagad: "Nagad", rocket: "Rocket", upay: "Upay"
};

// Check if this page is inside iframe/modal
if(window.self!== window.top){
  document.body.classList.add('in-modal');
  document.getElementById('backBtnDiv').innerHTML = `<button onclick="parent.closeOrderModal()" class="back-link btn-link"><i class="bi bi-x-lg"></i> Close</button>`;
}

window.onload = function(){
  const data = JSON.parse(localStorage.getItem('exchangeData'));
  if(!data){
    if(window.self === window.top) window.location.href = 'index.html';
    return;
  }

  // Auto fill wallets and amount
  sendWallet.value = wallets[data.send.wallet];
  let sendCurr = ['bkash','nagad','rocket','upay'].includes(data.send.wallet)? 'BDT' : 'USD';
  let getCurr = ['bkash','nagad','rocket','upay'].includes(data.get.wallet)? 'BDT' : 'USD';
  sendAmount.value = data.send.amount + " + sendCurr;
  getAmount.value = data.get.amount + " + getCurr;

  // Show summary
  summaryBox.style.display = 'block';
  summarySend.innerText = data.send.amount + " + sendCurr + " via " + wallets[data.send.wallet];
  summaryGet.innerText = data.get.amount + " + getCurr + " via " + wallets[data.get.wallet];

  // Auto fill user info from firebase
  auth.onAuthStateChanged(user => {
    if(user){
      fullName.value = user.displayName || '';
      email.value = user.email || '';
      db.ref('users/' + user.uid).once('value').then(snap => {
        const userData = snap.val();
        if(userData && userData.mobile){ walletAddress.value = userData.mobile; }
      });
    } else {
      // Not logged in
      if(window.self === window.top) window.location.href = 'customer.html';
    }
  });
}

document.getElementById('orderForm').onsubmit = function(e){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Submitting...';
  btn.disabled = true;

  const orderData = {
    name: fullName.value, email: email.value, sendWallet: sendWallet.value,
    sendAmount: sendAmount.value, getAmount: getAmount.value,
    walletAddress: walletAddress.value, status: 'Pending', timestamp: Date.now(),
    userId: auth.currentUser? auth.currentUser.uid : null
  };

  db.ref('orders').push(orderData)
.then(() => {
    document.getElementById('orderForm').style.display = 'none';
    document.getElementById('summaryBox').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
    localStorage.removeItem('exchangeData');

    // 2.5s por modal bondho hobe
    setTimeout(() => {
      if(window.self!== window.top){
        parent.closeOrderModal();
      } else {
        window.location.href = 'index.html';
      }
    }, 2500);
  })
.catch((error) => {
    orderMsg.innerHTML = "❌ Error: " + error.message;
    orderMsg.className = "text-danger";
    btn.innerHTML = '<i class="bi bi-check-circle"></i> Confirm & Submit Order';
    btn.disabled = false;
  });
}
</script>
</body>
</html>
