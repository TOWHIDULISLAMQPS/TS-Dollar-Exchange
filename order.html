<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Order - TS Dollar Exchange</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body { background: #f8f9fa; font-family: 'Poppins', sans-serif; }
.exchange-card { background:#fff; padding:40px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.1); margin-top:50px; }
.navbar-brand { font-weight: 700; color: #0d6efd!important; }
</style>

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fs-3" href="index.html">TS Dollar Exchange</a>
<a href="index.html" class="btn btn-outline-primary">Back to Home</a>
</div>
</nav>

<!-- ORDER FORM -->
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="exchange-card">
<h3 class="text-center mb-4">Complete Your Order</h3>

<form id="orderForm">
<div class="mb-3">
<label class="form-label">Your Full Name</label>
<input type="text" id="name" class="form-control" placeholder="Enter Your Name" required>
</div>

<div class="mb-3">
<label class="form-label">Your Email</label>
<input type="email" id="email" class="form-control" placeholder="Enter Your Email" required>
</div>

<div class="mb-3">
<label class="form-label">You Send</label>
<select id="walletType" class="form-select"></select>
</div>

<div class="mb-3">
<label class="form-label">Amount USD</label>
<input id="usdAmount" type="number" class="form-control" readonly>
</div>

<div class="mb-3">
<label class="form-label">You Will Receive</label>
<input id="resultBDT" type="text" class="form-control" readonly>
</div>

<div class="mb-4">
<label class="form-label">Your Wallet Address / Email</label>
<input type="text" id="walletAddress" class="form-control" placeholder="Payoneer/Wise Email" required>
</div>

<button type="submit" class="btn btn-success w-100 btn-lg">Confirm & Submit Order</button>
</form>

</div>
</div>
</div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="order.js"></script>
</body>
</html>
