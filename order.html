<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Order - TS Dollar Exchange</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body { background: #f8f9fa; font-family: 'Poppins', sans-serif; }
.exchange-card { background:#fff; padding:40px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.1); margin-top:50px; }
.navbar-brand { font-weight: 700; color: #0d6efd!important; }
.summary-box { background: #f0fdf4; border: 2px solid #10b981; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
</style>

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
<div class="container">
<a class="navbar-brand fs-3" href="index.html"><i class="fa fa-shield-halved text-warning"></i> TS Dollar Exchange</a>
<a href="index.html" class="btn btn-outline-primary">Back to Home</a>
</div>
</nav>

<!-- ORDER FORM -->
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="exchange-card">
<h3 class="text-center mb-4">Complete Your Order</h3>

<!-- ORDER SUMMARY -->
<div id="orderSummary" class="summary-box" style="display:none;">
  <h6 class="fw-bold mb-2"><i class="fa fa-info-circle text-success"></i> Order Summary</h6>
  <p class="mb-1">Send: <b id="summarySend"></b></p>
  <p class="mb-0">Receive: <b id="summaryGet"></b></p>
</div>

<form id="orderForm">
<div class="mb-3">
<label class="form-label">Your Full Name</label>
<input type="text" id="name" class="form-control" placeholder="Enter Your Name" required>
</div>

<div class="mb-3">
<label class="form-label">Your Email</label>
<input type="email" id="email" class="form-control" placeholder="Enter Your Email" required>
</div>

<div class="mb-3">
<label class="form-label">You Send</label>
<input id="sendWallet" class="form-control" readonly>
</div>

<div class="mb-3">
<label class="form-label">Amount</label>
<input id="sendAmount" type="number" class="form-control" readonly>
</div>

<div class="mb-3">
<label class="form-label">You Will Receive</label>
<input id="getWallet" class="form-control" readonly>
<input id="getAmount" type="text" class="form-control mt-2" readonly>
</div>

<div class="mb-4">
<label class="form-label">Your Wallet Address / Email</label>
<input type="text" id="walletAddress" class="form-control" placeholder="Payoneer/Wise/Bkash Number" required>
</div>

<button type="submit" class="btn btn-success w-100 btn-lg fw-bold">Confirm & Submit Order</button>
<p id="submitMsg" class="text-center mt-3"></p>
</form>

</div>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="order.js"></script>
</body>
</html>
