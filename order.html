<form id="orderForm" class="exchange-card">
    <h2>Complete Your Order</h2>

    <label>Your Name</label>
    <input type="text" id="name" required>

    <label>Your Email</label>
    <input type="email" id="email" required>

    <label>You Send</label>
    <select id="walletType"></select>

    <input type="number" id="usdAmount" readonly>

    <label>You Receive</label>
    <input type="text" id="resultBDT" readonly>

    <label>Your Wallet Address</label>
    <input type="text" id="walletAddress" required placeholder="Payoneer/Wise Email">

    <button type="submit">Confirm Order</button>
</form>
<script type="module" src="order.js"></script>
