<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Order - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{
  background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 50%, #3a0a5a 100%);
  color:#fff;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  padding: 20px 0;
}
.navbar-top{
  background: rgba(10,10,42,0.7); backdrop-filter: blur(20px);
  padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
}
.brand{ font-weight: 800; color: #fff; font-size: 18px; }
.brand i{ color: #fbbf24; }

.order-card{
  max-width: 520px;
  background: rgba(20, 20, 40, 0.6);
  padding:35px 30px;
  border-radius:20px;
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 25px 70px rgba(0,0,0,0.7);
  margin: 40px auto;
}
.form-label{ color:#cbd5e1; font-weight:600; font-size: 13px; margin-bottom: 6px; }
.form-control,.form-control[readonly]{
  background: rgba(10,15,30,0.8)!important;
  border:1px solid #2d3748;
  color:#fff!important;
  border-radius:10px;
  height:45px;
}
.form-control:focus{
  background: rgba(10,15,30,1)!important;
  border-color: #8b5cf6;
  box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
}
.form-control::placeholder{ color: #64748b; }

.btn-submit{
  background: linear-gradient(135deg, #10b981, #059669);
  border:none; border-radius:10px; height:48px; font-weight: 700;
  transition: 0.3s;
}
.btn-submit:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(16,185,129,0.4);
}
.back-link{ color: #38bdf8; font-size: 13px; text-decoration: none; }
.back-link:hover{ text-decoration: underline; }
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="navbar-top">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="brand"><i class="bi bi-shield-shaded"></i> TS Dollar Exchange</div>
    <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-house"></i> Back to Home</a>
  </div>
</div>

<!-- ORDER FORM -->
<div class="order-card">
  <h4 class="text-center mb-4 fw-bold"><i class="bi bi-bag-check-fill text-success"></i> Complete Your Order</h4>

  <form id="orderForm">
    <div class="mb-3">
      <label class="form-label">Your Full Name</label>
      <input id="fullName" type="text" class="form-control" placeholder="Enter Your Name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Your Email</label>
      <input id="email" type="email" class="form-control" placeholder="Enter Your Email" required>
    </div>

    <div class="mb-3">
      <label class="form-label">You Send</label>
      <input id="sendWallet" type="text" class="form-control" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Amount (USD)</label>
      <input id="sendAmount" type="text" class="form-control" placeholder="Enter Amount" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">You Will Receive (BDT)</label>
      <input id="getAmount" type="text" class="form-control" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">You Will Receive in</label>
      <input id="getWallet" type="text" class="form-control" readonly>
    </div>

    <div class="mb-4">
      <label class="form-label">Your Wallet Address / Number</label>
      <input id="walletAddress" type="text" class="form-control" placeholder="Payoneer/Wise/Bkash Number" required>
    </div>

    <button type="submit" class="btn btn-submit w-100 mb-3">
      <i class="bi bi-check-circle"></i> Confirm & Submit Order
    </button>

    <div class="text-center">
      <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
  </form>

  <p id="orderMsg" class="text-center mt-3"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt: "USDT", payoneer: "Payoneer", wise: "Wise", skrill: "Skrill",
  bkash: "Bkash", nagad: "Nagad", rocket: "Rocket", upay: "Upay"
};

// Load data from localStorage
window.onload = function(){
  const data = JSON.parse(localStorage.getItem('exchangeData'));
  if(!data){ window.location.href = 'index.html'; return; }

  sendWallet.value = wallets[data.send.wallet];
  sendAmount.value = data.send.amount + " + (data.send.wallet=='bkash'||data.send.wallet=='nagad'||data.send.wallet=='rocket'||data.send.wallet=='upay'? 'BDT' : 'USD');
  getWallet.value = wallets[data.get.wallet];
  getAmount.value = data.get.amount + " " + (data.get.wallet=='bkash'||data.get.wallet=='nagad'||data.get.wallet=='rocket'||data.get.wallet=='upay'? 'BDT' : 'USD');

  // Auto fill if user logged in
  auth.onAuthStateChanged(user => {
    if(user){
      fullName.value = user.displayName || '';
      email.value = user.email || '';
    }
  });
}

// Submit Order to Firebase
document.getElementById('orderForm').onsubmit = function(e){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Submitting...';
  btn.disabled = true;

  const orderData = {
    name: fullName.value,
    email: email.value,
    sendWallet: sendWallet.value,
    sendAmount: sendAmount.value,
    getWallet: getWallet.value,
    getAmount: getAmount.value,
    walletAddress: walletAddress.value,
    status: 'Pending',
    timestamp: Date.now()
  };

  db.ref('orders').push(orderData)
 .then(() => {
    orderMsg.innerHTML = "✅ Order Submitted Successfully! We will contact you soon.";
    orderMsg.className = "text-success";
    localStorage.removeItem('exchangeData');
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  })
 .catch((error) => {
    orderMsg.innerHTML = "❌ Error: " + error.message;
    orderMsg.className = "text-danger";
    btn.innerHTML = '<i class="bi bi-check-circle"></i> Confirm & Submit Order';
    btn.disabled = false;
  });
}
</script>
</body>
</html>
