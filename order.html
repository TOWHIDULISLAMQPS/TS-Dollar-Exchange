<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Order - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg1:#05051a; --bg2:#1a0a2e; --primary:#22c55e; --primary-glow:rgba(34,197,94,0.3); --card-bg:rgba(18,18,42,0.7); }
body{
  background: linear-gradient(135deg, var(--bg1), var(--bg2))!important; /* IMPORTANT */
  color:#e2e8f0; font-family:'Outfit',sans-serif; min-height:100vh; margin:0;
}

.order-wrap{ display:flex; align-items:center; justify-content:center; padding: 20px 10px; min-height:100vh; }
.order-card{
  width:100%; max-width: 500px;
  background: linear-gradient(180deg, rgba(18,18,42,0.95), rgba(12,12,30,0.95));
  border: 1px solid rgba(34,197,94,0.2);
  border-radius: 24px;
  padding: 0;
  box-shadow: 0 0 40px rgba(34,197,94,0.1), 0 30px 80px rgba(0,0,0,0.6);
  backdrop-filter: blur(20px);
  overflow: hidden;
  animation: slideUp 0.5s ease;
}
@keyframes slideUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }

.card-header{
  background: linear-gradient(135deg, var(--primary), #16a34a);
  padding: 25px 30px; text-align: center;
}
.card-header h4{ margin:0; font-weight: 800; color:#fff; font-size: 20px; }
.card-header small{ opacity:0.9; font-size:12px; }

/* Exchange Summary Card */
.summary-grid{
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px;
  background: var(--card-bg); padding: 20px; margin: 20px;
  border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
}
.summary-item{ text-align: center; }
.summary-item small{ color: #94a3b8; font-size: 11px; font-weight:600; }
.summary-item.amount{ font-size: 18px; font-weight: 800; }
.summary-item.wallet{ font-size: 12px; color: #cbd5e1; margin-top:2px; }
.arrow{ display:flex; align-items:center; justify-content:center; font-size: 20px; color: var(--primary); }

.form-body{ padding: 0 25px 25px; }

/* Floating Label Input - BIG */
.form-floating{ position: relative; margin-bottom: 16px; }
.form-floating input{
  background: rgba(5,8,20,0.8); border: 1.5px solid #1e293b; color:#fff;
  height: 54px; border-radius: 12px; padding: 22px 14px 10px; width:100%; font-size:15px; font-weight:600;
}
.form-floating input:focus{
  background: rgba(5,8,20,1); border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow); outline:none;
}
.form-floating label{
  position: absolute; top: 16px; left: 14px; color: #64748b;
  transition: 0.2s; pointer-events: none; font-size: 14px;
}
.form-floating input:focus ~ label,
.form-floating input:not(:placeholder-shown) ~ label{
  top: 8px; font-size: 11px; color: var(--primary);
}
input[readonly]{ opacity: 0.9; background: rgba(10,15,30,0.8)!important; }

.btn-premium{
  background: linear-gradient(135deg, var(--primary), #16a34a);
  border: none; border-radius: 14px; height: 54px; font-weight: 800; font-size: 16px;
  box-shadow: 0 8px 25px var(--primary-glow);
  transition: 0.3s; color:#fff;
}
.btn-premium:hover{
  transform: translateY(-2px);
  box-shadow: 0 12px 35px var(--primary-glow);
}

/* Success Animation */
.success-check{ width:80px; height:80px; margin:0 auto 15px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; animation:pop 0.6s; }
@keyframes pop{ 0%{transform:scale(0);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }
</style>
</head>
<body>

<div class="order-wrap">
  <div class="order-card">
    <div class="card-header">
      <h4><i class="bi bi-shield-lock-fill"></i> Secure Order</h4>
      <small>Your information is 100% encrypted</small>
    </div>

    <div id="summaryBox" class="summary-grid" style="display:none;">
      <div class="summary-item">
        <small>YOU SEND</small>
        <div class="amount text-danger" id="summarySendAmount">0</div>
        <div class="wallet" id="summarySendWallet"></div>
      </div>
      <div class="arrow"><i class="bi bi-arrow-right"></i></div>
      <div class="summary-item">
        <small>YOU GET</small>
        <div class="amount text-success" id="summaryGetAmount">0</div>
        <div class="wallet" id="summaryGetWallet"></div>
      </div>
    </div>

    <div class="form-body">
      <form id="orderForm">
        <div class="form-floating">
          <input id="fullName" type="text" placeholder=" " required>
          <label>Your Full Name</label>
        </div>

        <div class="form-floating">
          <input id="email" type="email" placeholder=" " required>
          <label>Your Email</label>
        </div>

        <div class="form-floating">
          <input id="walletAddress" type="text" placeholder=" " required>
          <label>Your Wallet Number / Address</label>
        </div>

        <div class="form-floating">
          <input id="sendWallet" type="text" placeholder=" " readonly>
          <label>Sending From</label>
        </div>

        <div class="form-floating">
          <input id="sendAmount" type="text" placeholder=" " readonly>
          <label>Send Amount</label>
        </div>

        <div class="form-floating">
          <input id="getAmount" type="text" placeholder=" " readonly>
          <label>You Will Receive</label>
        </div>

        <button type="submit" class="btn btn-premium w-100 mt-3">
          <i class="bi bi-check-circle-fill"></i> Confirm & Submit Order
        </button>
      </form>

      <div id="successBox" style="display:none;" class="text-center mt-4">
        <div class="success-check"><i class="bi bi-check-lg fs-1 text-white"></i></div>
        <h5 class="text-success fw-bold">Order Submitted!</h5>
        <p class="text-muted">Admin will contact you on WhatsApp in 2 minutes</p>
      </div>

      <p id="orderMsg" class="text-center mt-3"></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt: {name: "USDT"}, payoneer: {name: "Payoneer"}, wise: {name: "Wise"}, skrill: {name: "Skrill"},
  bkash: {name: "Bkash"}, nagad: {name: "Nagad"}, rocket: {name: "Rocket"}, upay: {name: "Upay"}
};

window.onload = function(){
  const data = JSON.parse(localStorage.getItem('exchangeData'));
  if(!data){
    if(window.self === window.top) window.location.href = 'index.html';
    return;
  }

  let sendCurr = ['bkash','nagad','rocket','upay'].includes(data.send.wallet)? 'BDT' : 'USD';
  let getCurr = ['bkash','nagad','rocket','upay'].includes(data.get.wallet)? 'BDT' : 'USD';

  // Summary box fill
  summaryBox.style.display = 'grid';
  summarySendAmount.innerText = data.send.amount + " + sendCurr;
  summarySendWallet.innerText = wallets[data.send.wallet].name;
  summaryGetAmount.innerText = data.get.amount + " + getCurr;
  summaryGetWallet.innerText = wallets[data.get.wallet].name;

  // Form fill
  sendWallet.value = wallets[data.send.wallet].name;
  sendAmount.value = data.send.amount + " + sendCurr;
  getAmount.value = data.get.amount + " " + getCurr;

  // Auto fill user info
  auth.onAuthStateChanged(user => {
    if(user){
      fullName.value = user.displayName || '';
      email.value = user.email || '';
      db.ref('users/' + user.uid).once('value').then(snap => {
        const userData = snap.val();
        if(userData && userData.mobile){ walletAddress.value = userData.mobile; }
      });
    }
  });
}

document.getElementById('orderForm').onsubmit = function(e){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
  btn.disabled = true;

  const orderData = {
    name: fullName.value, email: email.value, walletAddress: walletAddress.value,
    sendWallet: sendWallet.value, sendAmount: sendAmount.value, getAmount: getAmount.value,
    status: 'Pending', timestamp: Date.now(), userId: auth.currentUser? auth.currentUser.uid : null
  };

  db.ref('orders').push(orderData)
.then(() => {
    document.getElementById('orderForm').style.display = 'none';
    document.getElementById('summaryBox').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
    localStorage.removeItem('exchangeData');
    setTimeout(() => { if(window.self!== window.top){ parent.closeOrderModal(); } }, 2500);
  })
.catch((error) => {
    orderMsg.innerHTML = "❌ Error: " + error.message;
    orderMsg.className = "text-danger";
    btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Confirm & Submit Order';
    btn.disabled = false;
  });
}
</script>
</body>
</html>
