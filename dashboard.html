<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TS Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body{background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);color:#fff;font-family:'Poppins',sans-serif;min-height:100vh;}
.login-box{width:420px;margin:100px auto;background:rgba(30,41,59,0.8);padding:40px;border-radius:20px;backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);}
.card{background:rgba(30,41,59,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:25px;margin-bottom:25px;backdrop-filter:blur(20px);}
.stat-card{background:linear-gradient(135deg, #1e293b, #334155);padding:20px;border-radius:15px;border-left:4px solid #10b981;}
.form-control{background:#0f172a !important;border:1px solid #334155;color:#fff !important;}
.table-dark{--bs-table-bg:transparent;}
.badge{padding:8px 12px;border-radius:8px;font-weight:600;}
.badge-pending{background:#ef4444;} 
.badge-processing{background:#f59e0b;} 
.badge-completed{background:#10b981;}
#dashboardContent{display:none;}
.wallet-icon { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; margin-right: 8px; color: #fff; }
.rate-row { border-bottom: 1px dashed #334155; padding: 15px 0; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">
  <h3 class="text-center mb-4 fw-bold"><i class="bi bi-shield-check text-success"></i> TS Admin Login</h3>
  <input id="email" type="email" value="towhidulislamtuhin872@gmail.com" class="form-control mb-3">
  <input id="password" type="password" placeholder="Password" class="form-control mb-3">
  <button onclick="login()" class="btn btn-success w-100 fw-bold py-2">Login</button>
  <p id="loginMsg" class="text-center mt-3"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboardContent" class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold"><i class="bi bi-speedometer2 text-warning"></i> TS Admin Dashboard</h3>
    <button class="btn btn-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </div>

  <!-- STATS -->
  <div class="row g-3 mb-4">
    <div class="col-md-3"><div class="stat-card"><small class="text-muted">Total Orders</small><h3 id="totalOrders">0</h3></div></div>
    <div class="col-md-3"><div class="stat-card" style="border-color:#ef4444"><small class="text-muted">Pending</small><h3 id="pendingOrders" class="text-danger">0</h3></div></div>
    <div class="col-md-3"><div class="stat-card" style="border-color:#f59e0b"><small class="text-muted">Processing</small><h3 id="processingOrders" class="text-warning">0</h3></div></div>
    <div class="col-md-3"><div class="stat-card" style="border-color:#10b981"><small class="text-muted">Completed</small><h3 id="completedOrders" class="text-success">0</h3></div></div>
  </div>

  <!-- RATE CONTROL -->
  <div class="card">
    <h5 class="mb-3"><i class="bi bi-graph-up-arrow text-success"></i> Live Exchange Rate Control</h5>
    <div id="rateForm"></div>
    <button class="btn btn-success w-100 mt-3 fw-bold py-2" onclick="updateRates()"><i class="bi bi-cloud-arrow-up"></i> Save All Rates</button>
    <p id="rateStatus" class="mt-2 text-center"></p>
  </div>

  <!-- ORDERS -->
  <div class="card">
    <h5 class="mb-3"><i class="bi bi-list-task text-primary"></i> Recent Orders</h5>
    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle">
        <thead style="border-bottom:2px solid #334155">
          <tr>
            <th>Time</th><th>Customer</th><th>Send</th><th>Receive</th>
            <th>Amount</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// WALLET DATA WITH ICON + COLOR
const wallets = {
  usdt: { name: "USDT", icon: "₮", color: "#26A17B" },
  payoneer: { name: "Payoneer", icon: "P", color: "#FF4800" },
  wise: { name: "Wise", icon: "W", color: "#00B9FF" },
  skrill: { name: "Skrill", icon: "S", color: "#8A2BE2" },
  bkash: { name: "Bkash", icon: "bK", color: "#E2136E" },
  nagad: { name: "Nagad", icon: "N", color: "#F26522" },
  rocket: { name: "Rocket", icon: "R", color: "#8B0000" },
  upay: { name: "Upay", icon: "U", color: "#FF6B00" }
};

// Auth
auth.onAuthStateChanged(user => {
  if(user){ showDashboard(); } 
  else { document.getElementById('loginPage').style.display='block'; }
})
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .catch(e=>{ loginMsg.innerHTML="Error: "+e.message; loginMsg.className="text-danger"; })
}
function logout(){ auth.signOut(); }
function showDashboard(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('dashboardContent').style.display='block';
  loadRates(); loadOrders();
}

// LOAD RATES WITH ICON
function loadRates(){
  db.ref('rates/wallets').on('value', snap=>{
    const rates = snap.val() || {};
    let html='';
    for(let key in wallets){
      html += `<div class="row rate-row align-items-center">
        <div class="col-3 d-flex align-items-center">
          <div class="wallet-icon" style="background:${wallets[key].color}">${wallets[key].icon}</div>
          <b>${wallets[key].name}</b>
        </div>
        <div class="col-4">
          <label class="small text-success">Buy Rate ৳</label>
          <input type="number" step="0.01" id="buy_${key}" value="${rates[key]?.buy || ''}" class="form-control">
        </div>
        <div class="col-4">
          <label class="small text-danger">Sell Rate ৳</label>
          <input type="number" step="0.01" id="sell_${key}" value="${rates[key]?.sell || ''}" class="form-control">
        </div>
      </div>`;
    }
    document.getElementById('rateForm').innerHTML=html;
  });
}

// SAVE RATES
function updateRates(){
  rateStatus.innerHTML="Saving..."; rateStatus.className="text-warning";
  let updates={};
  for(let key in wallets){
    updates[`rates/wallets/${key}/buy`] = parseFloat(document.getElementById(`buy_${key}`).value) || 0;
    updates[`rates/wallets/${key}/sell`] = parseFloat(document.getElementById(`sell_${key}`).value) || 0;
  }
  db.ref().update(updates).then(()=>{
    rateStatus.innerHTML="✅ Updated Successfully!"; rateStatus.className="text-success";
    setTimeout(()=>rateStatus.innerHTML='', 2000);
  });
}

// LOAD ORDERS WITH ICON + FIX undefined
function loadOrders(){
  db.ref('orders').orderByChild('timestamp').limitToLast(20).on('value', snap=>{
    let html=''; let t=0,p=0,pr=0,c=0;
    snap.forEach(child=>{
      let o = child.val(); let id = child.key;
      t++; if(o.status=='pending')p++; if(o.status=='processing')pr++; if(o.status=='completed')c++;

      let badge = o.status=='pending'?'<span class="badge badge-pending">Pending</span>':
                  o.status=='processing'?'<span class="badge badge-processing">Processing</span>':
                  '<span class="badge badge-completed">Completed</span>';

      let action = o.status=='pending'?`<button class="btn btn-sm btn-warning" onclick="updateStatus('${id}','processing')">Process</button>`:
                   o.status=='processing'?`<button class="btn btn-sm btn-success" onclick="updateStatus('${id}','completed')">Release</button>`:
                   '<span class="text-muted">Done</span>';

      html = `<tr>
        <td><small>${new Date(o.timestamp).toLocaleString('bn-BD')}</small></td>
        <td>${o.name}<br><small class="text-muted">${o.email}</small></td>
        <td>
          <div class="wallet-icon" style="background:${wallets[o.sendWallet]?.color || '#666'}; width:24px; height:24px; font-size:12px">${wallets[o.sendWallet]?.icon || '?'}</div>
          ${o.sendAmount} ${wallets[o.sendWallet]?.name || o.sendWallet}
        </td>
        <td>
          <div class="wallet-icon" style="background:${wallets[o.getWallet]?.color || '#666'}; width:24px; height:24px; font-size:12px">${wallets[o.getWallet]?.icon || '?'}</div>
          ${o.getAmount} ${wallets[o.getWallet]?.name || o.getWallet}
        </td>
        <td><b>৳${o.bdtAmount || 0}</b></td>
        <td>${badge}</td>
        <td>${action}</td>
      </tr>` + html;
    });
    ordersTable.innerHTML=html || '<tr><td colspan="7" class="text-center">No Orders</td></tr>';
    totalOrders.innerText=t; pendingOrders.innerText=p; processingOrders.innerText=pr; completedOrders.innerText=c;
  });
}

function updateStatus(id, status){
  if(confirm("Status Update করবেন?")){
    db.ref('orders/'+id).update({status: status});
  }
}
</script>
</body>
</html>
