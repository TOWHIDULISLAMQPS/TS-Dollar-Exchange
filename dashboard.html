<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body{background:#0f172a;color:#fff;font-family:'Poppins',sans-serif;}
.login-box{width:420px;margin:100px auto;background:#1e293b;padding:40px;border-radius:20px;box-shadow:0 0 30px rgba(16,185,129,.3);}
.card{background:#1e293b;border:1px solid #334155;border-radius:15px;padding:20px;margin-bottom:20px;}
.form-control{background:#0f172a !important;border:1px solid #334155;color:#fff !important;}
#dashboardContent{display:none;}
.table-dark{--bs-table-bg:#0f172a;}
.stat-card { background: #2e3247; padding: 15px; border-radius: 8px; text-align: center; }
.badge-pending{background:#ef4444;} 
.badge-processing{background:#f59e0b;} 
.badge-completed{background:#10b981;}
.btn-process{background:#f59e0b;border:none;}
.btn-release{background:#10b981;border:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">
  <h3 class="text-center mb-4"><i class="bi bi-shield-lock text-success"></i> Admin Login</h3>
  <input id="email" type="email" value="towhidulislamtuhin872@gmail.com" class="form-control mb-3">
  <input id="password" type="password" placeholder="Password" class="form-control mb-3">
  <button onclick="login()" class="btn btn-success w-100 fw-bold">Login</button>
  <p id="loginMsg" class="text-center mt-3"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboardContent" class="container py-4">
  <div class="d-flex justify-content-between mb-4">
    <h3>TS Admin Dashboard</h3>
    <button class="btn btn-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </div>

  <!-- STATS -->
  <div class="row g-3 mb-4">
    <div class="col-md-3"><div class="stat-card"><small>Total Orders</small><h4 id="totalOrders">0</h4></div></div>
    <div class="col-md-3"><div class="stat-card"><small>Pending</small><h4 id="pendingOrders" class="text-danger">0</h4></div></div>
    <div class="col-md-3"><div class="stat-card"><small>Processing</small><h4 id="processingOrders" class="text-warning">0</h4></div></div>
    <div class="col-md-3"><div class="stat-card"><small>Completed</small><h4 id="completedOrders" class="text-success">0</h4></div></div>
  </div>

  <!-- RATE CONTROL -->
  <div class="card">
    <h5><i class="bi bi-graph-up"></i> Exchange Rate Control</h5>
    <p class="text-muted">এখানে Rate Change করলে Main Page এ Auto Update হবে</p>
    <div id="rateForm"></div>
    <button class="btn btn-success w-100 mt-3 fw-bold" onclick="updateRates()">Save All Rates</button>
    <p id="rateStatus" class="mt-2"></p>
  </div>

  <!-- ORDERS -->
  <div class="card">
    <h5><i class="bi bi-list-check"></i> New Orders</h5>
    <div class="table-responsive">
      <table class="table table-dark table-sm align-middle">
        <thead><tr><th>Time</th><th>Customer</th><th>Send</th><th>Get</th><th>BDT Amount</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt:"USDT", payoneer:"Payoneer", wise:"Wise", skrill:"Skrill",
  bkash:"Bkash", nagad:"Nagad", rocket:"Rocket", upay:"Upay"
};

// Auth Check
auth.onAuthStateChanged(user => {
  if(user){ showDashboard(); } 
  else { document.getElementById('loginPage').style.display='block'; document.getElementById('dashboardContent').style.display='none'; }
})

function login(){
  loginMsg.innerHTML="Logging in..."; loginMsg.className="text-warning";
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(()=>{ loginMsg.innerHTML="Login Success!"; loginMsg.className="text-success"; })
  .catch(e=>{ loginMsg.innerHTML="Error: "+e.message; loginMsg.className="text-danger"; })
}
function logout(){ auth.signOut(); }
function showDashboard(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('dashboardContent').style.display='block';
  loadRates(); loadOrders();
}

// LOAD RATES TO FORM
function loadRates(){
  db.ref('rates/wallets').on('value', snap=>{
    const rates = snap.val() || {};
    let html='';
    for(let key in wallets){
      html += `<div class="row mb-3 align-items-center">
        <div class="col-3"><b>${wallets[key]}</b></div>
        <div class="col-4">Buy Rate: <input type="number" step="0.01" id="buy_${key}" value="${rates[key]?.buy || ''}" class="form-control form-control-sm"></div>
        <div class="col-4">Sell Rate: <input type="number" step="0.01" id="sell_${key}" value="${rates[key]?.sell || ''}" class="form-control form-control-sm"></div>
      </div>`;
    }
    document.getElementById('rateForm').innerHTML=html;
  });
}

// SAVE RATES
function updateRates(){
  rateStatus.innerHTML="Saving..."; rateStatus.className="text-warning";
  let updates={};
  for(let key in wallets){
    let buyVal = document.getElementById(`buy_${key}`).value;
    let sellVal = document.getElementById(`sell_${key}`).value;
    if(buyVal) updates[`rates/wallets/${key}/buy`] = parseFloat(buyVal);
    if(sellVal) updates[`rates/wallets/${key}/sell`] = parseFloat(sellVal);
  }
  db.ref().update(updates).then(()=>{
    rateStatus.innerHTML="✅ Rates Updated! Main page এ auto show হবে"; 
    rateStatus.className="text-success";
    setTimeout(()=>rateStatus.innerHTML='', 3000);
  }).catch(e=>{
    rateStatus.innerHTML="❌ Error: "+e.message; 
    rateStatus.className="text-danger";
  });
}

// LOAD ORDERS + 2 STEP ACTION
function loadOrders(){
  db.ref('orders').orderByChild('timestamp').limitToLast(30).on('value', snap=>{
    let html='';
    let total=0, pending=0, processing=0, completed=0;
    
    snap.forEach(child=>{
      let o = child.val(); let id = child.key;
      total++;
      if(o.status=='pending') pending++;
      if(o.status=='processing') processing++;
      if(o.status=='completed') completed++;

      let statusBadge = '';
      let actionBtn = '';
      
      if(o.status=='pending'){
        statusBadge = `<span class="badge badge-pending">Pending</span>`;
        actionBtn = `<button class="btn btn-sm btn-process" onclick="updateOrderStatus('${id}','processing')"><i class="bi bi-hourglass-split"></i> Process</button>`;
      }
      else if(o.status=='processing'){
        statusBadge = `<span class="badge badge-processing">Processing</span>`;
        actionBtn = `<button class="btn btn-sm btn-release" onclick="updateOrderStatus('${id}','completed')"><i class="bi bi-check-circle"></i> Release</button>`;
      }
      else{
        statusBadge = `<span class="badge badge-completed">Completed</span>`;
        actionBtn = `<span class="text-muted">Done</span>`;
      }

      html = `<tr>
        <td><small>${new Date(o.timestamp).toLocaleString('bn-BD')}</small></td>
        <td>${o.name}<br><small class="text-muted">${o.email}</small></td>
        <td>${o.sendAmount} ${wallets[o.sendWallet]}</td>
        <td>${o.getAmount} ${wallets[o.getWallet]}</td>
        <td><b>৳${o.bdtAmount}</b></td>
        <td>${statusBadge}</td>
        <td>${actionBtn}</td>
      </tr>` + html;
    });
    
    ordersTable.innerHTML=html || '<tr><td colspan="7" class="text-center">No Orders Yet</td></tr>';
    totalOrders.innerText=total;
    pendingOrders.innerText=pending;
    processingOrders.innerText=processing;
    completedOrders.innerText=completed;
  });
}

function updateOrderStatus(id, status){
  let confirmMsg = status=='processing' ? "Order Processing এ নিবেন?" : "Order Release করবেন?";
  if(confirm(confirmMsg)){
    db.ref('orders/'+id).update({
      status: status, 
      updatedAt: Date.now()
    });
  }
}

// Enter Key Login
document.addEventListener('keypress', function(e){ if(e.key === 'Enter'){ login(); } })
</script>
</body>
</html>
