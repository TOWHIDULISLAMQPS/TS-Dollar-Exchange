<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#0f172a;color:#fff;font-family:'Poppins',sans-serif;}
.login-box{width:420px;margin:100px auto;background:#1e293b;padding:40px;border-radius:20px;}
.card{background:#1e293b;border:1px solid #334155;border-radius:15px;padding:20px;margin-bottom:20px;}
.form-control{background:#0f172a !important;border:1px solid #334155;color:#fff !important;}
#dashboardContent{display:none;}
.table-dark{--bs-table-bg:#0f172a;}
.badge-pending{background:#f59e0b;} .badge-completed{background:#10b981;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">
  <h3 class="text-center mb-4">🔒 Admin Login</h3>
  <input id="email" type="email" value="towhidulislamtuhin872@gmail.com" class="form-control mb-3">
  <input id="password" type="password" placeholder="Password" class="form-control mb-3">
  <button onclick="login()" class="btn btn-success w-100 fw-bold">Login</button>
  <p id="loginMsg" class="text-center mt-3"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboardContent" class="container py-4">
  <div class="d-flex justify-content-between mb-4">
    <h3>TS Admin Dashboard</h3>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>

  <!-- RATE CONTROL -->
  <div class="card">
    <h5>⚡ Exchange Rate Control</h5>
    <p class="text-muted">এখানে Rate Change করলে Main Page এ Auto Update হবে</p>
    <div id="rateForm"></div>
    <button class="btn btn-success w-100 mt-3" onclick="updateRates()">Save All Rates</button>
    <p id="rateStatus" class="mt-2"></p>
  </div>

  <!-- ORDERS -->
  <div class="card">
    <h5>📦 New Orders</h5>
    <table class="table table-dark table-sm">
      <thead><tr><th>Time</th><th>Customer</th><th>Send</th><th>Get</th><th>Amount</th><th>Action</th></tr></thead>
      <tbody id="ordersTable"></tbody>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt:"USDT", payoneer:"Payoneer", wise:"Wise", skrill:"Skrill",
  bkash:"Bkash", nagad:"Nagad", rocket:"Rocket", upay:"Upay"
};

// Auth Check
auth.onAuthStateChanged(user => {
  if(user){ showDashboard(); } 
  else { document.getElementById('loginPage').style.display='block'; }
})

function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(()=>{ loginMsg.innerHTML="Success!"; })
  .catch(e=>{ loginMsg.innerHTML="Error: "+e.message; loginMsg.className="text-danger"; })
}
function logout(){ auth.signOut(); }
function showDashboard(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('dashboardContent').style.display='block';
  loadRates(); loadOrders();
}

// LOAD RATES TO FORM
function loadRates(){
  db.ref('rates/wallets').on('value', snap=>{
    const rates = snap.val() || {};
    let html='';
    for(let key in wallets){
      html += `<div class="row mb-2">
        <div class="col-3"><b>${wallets[key]}</b></div>
        <div class="col-4">Buy: <input id="buy_${key}" value="${rates[key]?.buy || ''}" class="form-control form-control-sm"></div>
        <div class="col-4">Sell: <input id="sell_${key}" value="${rates[key]?.sell || ''}" class="form-control form-control-sm"></div>
      </div>`;
    }
    document.getElementById('rateForm').innerHTML=html;
  });
}

// SAVE RATES
function updateRates(){
  rateStatus.innerHTML="Saving..."; rateStatus.className="text-warning";
  let updates={};
  for(let key in wallets){
    updates[`rates/wallets/${key}/buy`] = parseFloat(document.getElementById(`buy_${key}`).value);
    updates[`rates/wallets/${key}/sell`] = parseFloat(document.getElementById(`sell_${key}`).value);
  }
  db.ref().update(updates).then(()=>{
    rateStatus.innerHTML="✅ Rates Updated! Main page এ auto show হবে"; 
    rateStatus.className="text-success";
  });
}

// LOAD ORDERS + RELEASE BUTTON
function loadOrders(){
  db.ref('orders').orderByChild('timestamp').limitToLast(20).on('value', snap=>{
    let html='';
    snap.forEach(child=>{
      let o = child.val(); let id = child.key;
      html = `<tr>
        <td>${new Date(o.timestamp).toLocaleString('bn-BD')}</td>
        <td>${o.name}<br><small>${o.email}</small></td>
        <td>${o.sendAmount} ${o.sendWallet}</td>
        <td>${o.getAmount} ${o.getWallet}</td>
        <td>৳${o.bdtAmount}</td>
        <td>${o.status=='pending'?`<button class="btn btn-sm btn-success" onclick="releaseOrder('${id}')">Release</button>`:`<span class="badge badge-completed">Released</span>`}</td>
      </tr>` + html;
    });
    ordersTable.innerHTML=html;
  });
}

function releaseOrder(id){
  if(confirm("Order Release করবেন?")){
    db.ref('orders/'+id).update({status:'completed', releasedAt:Date.now()});
  }
}
</script>
</body>
</html>
