<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - TS Dollar Exchange</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#071826;color:white;}
.navbar{background:#0d6efd;}
.card{background:#1a2b3c;color:white;border:none;border-radius:15px;}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

<nav class="navbar navbar-dark px-3">
<span class="navbar-brand fw-bold">TS Dollar Exchange - Admin</span>
<button onclick="logout()" class="btn btn-danger">Logout</button>
</nav>

<div class="container mt-4">
<h1 class="text-center mb-4">Welcome to Dashboard ✅</h1>
<div class="row g-3">
<div class="col-6 col-md-4"><div class="card p-3 text-center"><h5>Total Users</h5><h2>0</h2></div></div>
<div class="col-6 col-md-4"><div class="card p-3 text-center"><h5>Total Dollar</h5><h2>$0</h2></div></div>
<div class="col-12 col-md-4"><div class="card p-3 text-center"><h5>Total BDT</h5><h2>৳0</h2></div></div>
</div>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",authDomain:"ts-dollar-exchange.firebaseapp.com"});
const auth = firebase.auth();

// Login না থাকলে login.html এ পাঠাবে
auth.onAuthStateChanged((user) => {
if (!user) {
window.location.href = "login.html";
}
});

function logout(){
auth.signOut().then(()=>{window.location.href="login.html";});
}
</script>
</body>
</html>
