<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard - TS Dollar Exchange</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{background:#0f172a;color:#fff;font-family:'Poppins',sans-serif;min-height:100vh;}
.navbar{background:rgba(30,41,59,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.1);}
.card{background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:25px;margin-bottom:25px;backdrop-filter:blur(20px);}
.table-dark{--bs-table-bg:transparent;}
.badge{padding:8px 12px;border-radius:8px;font-weight:600;}
.badge-pending{background:#ef4444;} 
.badge-processing{background:#f59e0b;} 
.badge-completed{background:#10b981;}
.wallet-icon { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; margin-right: 6px; color: #fff; }
</style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold"><i class="bi bi-speedometer2 text-warning"></i> My Dashboard</a>
    <button class="btn btn-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </div>
</nav>

<div class="container py-4">
  <h4 id="welcomeUser" class="mb-4">Loading...</h4>

  <div class="row g-3 mb-4">
    <div class="col-md-4"><div class="card text-center"><h6 class="text-muted">Total Orders</h6><h3 id="totalOrders">0</h3></div></div>
    <div class="col-md-4"><div class="card text-center"><h6 class="text-muted">Pending</h6><h3 id="pendingOrders" class="text-warning">0</h3></div></div>
    <div class="col-md-4"><div class="card text-center"><h6 class="text-muted">Completed</h6><h3 id="completedOrders" class="text-success">0</h3></div></div>
  </div>

  <div class="card">
    <h5 class="mb-3"><i class="bi bi-clock-history text-primary"></i> My Order History</h5>
    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle">
        <thead><tr><th>Date</th><th>Send</th><th>Receive</th><th>BDT Amount</th><th>Status</th></tr></thead>
        <tbody id="myOrders"><tr><td colspan="5" class="text-center">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <a href="index.html" class="btn btn-success fw-bold"><i class="bi bi-plus-circle"></i> New Exchange</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBC0OA7gEWg1dfVzqVpI1YgbKzNKllz4pg",
  authDomain:"ts-dollar-exchange.firebaseapp.com",
  databaseURL:"https://ts-dollar-exchange-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ts-dollar-exchange"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wallets = {
  usdt: { name: "USDT", icon: "₮", color: "#26A17B" },
  payoneer: { name: "Payoneer", icon: "P", color: "#FF4800" },
  wise: { name: "Wise", icon: "W", color: "#00B9FF" },
  skrill: { name: "Skrill", icon: "S", color: "#8A2BE2" },
  bkash: { name: "Bkash", icon: "bK", color: "#E2136E" },
  nagad: { name: "Nagad", icon: "N", color: "#F26522" },
  rocket: { name: "Rocket", icon: "R", color: "#8B0000" },
  upay: { name: "Upay", icon: "U", color: "#FF6B00" }
};

auth.onAuthStateChanged(user => {
  if(!user){ window.location='customer.html'; return; }
  
  db.ref('users/'+user.uid).once('value', snap=>{
    welcomeUser.innerText = "Welcome, " + (snap.val()?.name || user.email);
  });

  // Load only this user's orders
  db.ref('orders').orderByChild('userId').equalTo(user.uid).on('value', snap=>{
    let html=''; let t=0,p=0,c=0;
    snap.forEach(child=>{
      let o = child.val();
      t++; if(o.status=='pending')p++; if(o.status=='completed')c++;

      let badge = o.status=='pending'?'<span class="badge badge-pending">Pending</span>':
                  o.status=='processing'?'<span class="badge badge-processing">Processing</span>':
                  '<span class="badge badge-completed">Completed</span>';

      html = `<tr>
        <td><small>${new Date(o.timestamp).toLocaleString('bn-BD')}</small></td>
        <td><div class="wallet-icon" style="background:${wallets[o.sendWallet]?.color || '#666'}">${wallets[o.sendWallet]?.icon || '?'}</div>${o.sendAmount} ${wallets[o.sendWallet]?.name || ''}</td>
        <td><div class="wallet-icon" style="background:${wallets[o.getWallet]?.color || '#666'}">${wallets[o.getWallet]?.icon || '?'}</div>${o.getAmount} ${wallets[o.getWallet]?.name || ''}</td>
        <td><b>৳${o.bdtAmount || 0}</b></td>
        <td>${badge}</td>
      </tr>` + html;
    });
    myOrders.innerHTML = html || '<tr><td colspan="5" class="text-center">No Orders Yet</td></tr>';
    totalOrders.innerText=t; pendingOrders.innerText=p; completedOrders.innerText=c;
  });
})

function logout(){ auth.signOut().then(()=>window.location='customer.html'); }
</script>
</body>
</html>
